<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>コレクション</title>
<link rel="apple-touch-icon" href="apple-touch-icon-collection.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#f0ede8;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#aaa;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --radius:8px;--radius-lg:12px;
  --warning-bg:#fef9c3;--warning-text:#854d0e;
  --danger:#dc2626;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;overflow-anchor:none}
.sticky-header{position:sticky;top:0;z-index:10;background:var(--bg3);max-width:600px;margin:0 auto;padding:1rem 1rem 0}
.app{max-width:600px;margin:0 auto;padding:0 1rem 1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.header h1{font-size:20px;font-weight:600}
.btn{background:transparent;border:0.5px solid var(--border2);border-radius:var(--radius);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-sm{padding:4px 8px;font-size:12px}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-icon{padding:4px;border:none;background:none;cursor:pointer;color:var(--text3);display:inline-flex;align-items:center;border-radius:4px}
.btn-icon:hover{color:var(--danger);background:rgba(220,38,38,0.08)}
.search-wrap{position:relative;margin-bottom:1rem}
.search-wrap input{width:100%;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:9px 32px 9px 12px;font-size:14px;color:var(--text);font-family:inherit;outline:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);display:none;padding:2px}
.tabs{display:flex;margin-bottom:0;border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none}
.sort-bar{display:flex;gap:6px;padding:8px 0 10px;align-items:center}
.sort-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--text2);cursor:pointer;appearance:none;-webkit-appearance:none}
.sort-btn.active{background:var(--text);color:var(--bg3);border-color:var(--text)}
select.sort-btn{padding-right:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.tab.tab-match{color:var(--warning-text);border-bottom-color:var(--warning-text);font-weight:600;background:var(--warning-bg)}
.tab:hover{color:var(--text)}
.tab-add{padding:8px 10px;font-size:13px;cursor:pointer;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;font-family:inherit}
.tab-add:hover{color:var(--text)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:0.875rem 1rem}
.card.jk-selected{border-color:var(--text)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.cat-btn{font-size:11px;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer;font-family:inherit;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.cat-btn:hover{border-color:var(--border2)}
.card-editor{width:100%;min-height:40px;font-size:14px;color:var(--text);line-height:1.6;outline:none}
.card-editor .ProseMirror{outline:none;min-height:40px;word-break:break-word}
.card-editor .ProseMirror p{margin:0 0 2px}
.card-editor .ProseMirror p:last-child{margin-bottom:0}
.card-editor .ProseMirror h1{font-size:18px;font-weight:700;margin:4px 0 2px;line-height:1.3}
.card-editor .ProseMirror a{color:#2563eb;text-decoration:underline;cursor:pointer;word-break:break-all}
.card-editor .ProseMirror strong{font-weight:700}
.card-editor .ProseMirror em{font-style:italic}
.card-editor .ProseMirror p.is-editor-empty:first-child::before{content:attr(data-placeholder);color:var(--text3);pointer-events:none;float:left;height:0}
.card-editor .ProseMirror img{max-width:120px;max-height:120px;border-radius:6px;object-fit:cover;cursor:zoom-in;display:inline-block;vertical-align:top;margin:2px}
.card-editor .ProseMirror img.ProseMirror-selectednode{outline:2px solid var(--text2)}
.editor-toolbar{display:none;gap:2px;margin-bottom:6px;flex-wrap:wrap}
.card:focus-within .editor-toolbar{display:flex}
.tb-btn{background:none;border:0.5px solid var(--border);border-radius:4px;padding:2px 6px;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;line-height:1.4}
.tb-btn:hover,.tb-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.card-body-view{width:100%;font-size:14px;color:var(--text);line-height:1.6;word-break:break-word;cursor:text;min-height:40px}
.card-body-view mark{background:#f59e0b;color:#000;border-radius:2px;padding:0 1px}
.card-body-view p{margin:0 0 2px}
.card-body-view p:last-child{margin-bottom:0}
.card-body-view h1{font-size:18px;font-weight:700;margin:4px 0 2px}
.card-body-view a{color:#2563eb;text-decoration:underline;cursor:pointer;word-break:break-all}
.card-body-view strong{font-weight:700}
.card-body-view em{font-style:italic}
.img-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;overflow:hidden}
.lb-track{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform}
.lb-slide{display:flex;align-items:center;justify-content:center;width:100vw;height:100%;box-sizing:border-box;padding:0 8px}
.lb-slide img{max-width:100%;max-height:82vh;border-radius:8px;display:block;user-select:none;-webkit-user-drag:none}
.img-modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;border-radius:50%;width:36px;height:36px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.img-modal-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;border-radius:50%;width:40px;height:40px;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s}
.img-modal-arrow:hover{background:rgba(255,255,255,0.3)}
.img-modal-arrow.prev{left:12px}
.img-modal-arrow.next{right:12px}
.img-modal-arrow:disabled{opacity:0.2;cursor:default;pointer-events:none}
.img-modal-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.7);font-size:13px}
.card-date{font-size:11px;color:var(--text3);margin-top:6px}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.byte-count{font-size:11px;color:var(--text3)}
.byte-count.warn{color:#f59e0b}
.byte-count.over{color:var(--danger);font-weight:500}
mark{background:var(--warning-bg);color:var(--warning-text);border-radius:2px;padding:0 1px}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px}
.search-count{font-size:12px;color:var(--text3);margin-bottom:1rem}
.panel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:1rem}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.panel-title{font-size:15px;font-weight:500}
.trash-item{padding:10px 0;border-bottom:0.5px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.trash-item:last-child{border-bottom:none}
.trash-item-body{flex:1;font-size:13px;color:var(--text2);line-height:1.5}
.trash-item-meta{font-size:11px;color:var(--text3);margin-top:2px}
.cat-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-add-row{display:flex;gap:8px;margin-top:1rem}
.cat-add-row input{flex:1;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;padding:1rem}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg);border-radius:var(--radius-lg);padding:1.25rem;width:100%;max-width:360px;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.modal-title{font-size:15px;font-weight:500}
.cat-option{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px}
.cat-option:hover{background:var(--bg2)}
.cat-option.selected{font-weight:500;background:var(--bg2)}
.cat-modal-add{display:flex;gap:8px;margin-top:0.75rem;padding-top:0.75rem;border-top:0.5px solid var(--border)}
.cat-modal-add input{flex:1;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.sync-status{font-size:11px;color:var(--text3);text-align:right;padding:0 0 6px}
svg.icon{display:inline-block;vertical-align:-3px;flex-shrink:0}

/* スマホ用ボトムバー */
.bottom-bar{display:none}
@media(max-width:640px){
  .sticky-header .header > div{display:none}
  .sticky-header .search-wrap{display:none}
  .app{padding-bottom:92px}
  .bottom-bar{
    display:block;
    position:fixed;
    bottom:0;left:0;right:0;
    z-index:50;
    background:var(--bg);
    border-top:0.5px solid var(--border);
    padding:8px 12px calc(20px + env(safe-area-inset-bottom));
  }
  .bb-buttons{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .bb-buttons button{
    flex:1;
    background:none;
    border:none;
    color:var(--text2);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-size:10px;
    font-family:inherit;
    cursor:pointer;
    padding:4px 0;
  }
  .bb-buttons button.primary{color:var(--text)}
  .bb-search-row{
    display:none;
    gap:8px;
    align-items:center;
  }
  .bottom-bar.searching .bb-buttons{display:none}
  .bottom-bar.searching .bb-search-row{display:flex}
  .bb-search-row input{
    flex:1;
    background:var(--bg2);
    border:0.5px solid var(--border2);
    border-radius:var(--radius);
    padding:10px 12px;
    font-size:16px;
    color:var(--text);
    font-family:inherit;
    outline:none;
  }
  .bb-search-row button{
    background:none;
    border:none;
    color:var(--text2);
    cursor:pointer;
    padding:6px;
    font-family:inherit;
    font-size:14px;
  }
}
/* PC（左サイドバー＋右フルハイト詳細）レイアウト */
.layout{display:block}
.left-col{}
.detail-pane{display:none}
.pv-item{display:none}
@media(min-width:900px){
  body{overflow:hidden}
  .layout{display:flex;height:100vh;align-items:stretch}
  .left-col{flex:1 1 50%;min-width:0;height:100vh;overflow-y:auto;border-right:0.5px solid var(--border)}
  .left-col .sticky-header{max-width:none;margin:0}
  .left-col .app{max-width:none;margin:0}
  .sort-bar{flex-wrap:wrap}
  #cards{display:flex;flex-direction:column;gap:8px}
  .detail-pane{display:block;flex:1 1 50%;min-width:0;height:100vh;overflow-y:auto;padding:16px}
  .detail-pane .card{min-height:calc(100vh - 32px);padding:1.5rem 1.75rem}
  .detail-pane .card-editor .ProseMirror img{max-width:240px;max-height:240px}
  .pv-item{display:block;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;cursor:pointer;transition:border-color .1s}
  .pv-item:hover{border-color:var(--border2)}
  .pv-selected{border-color:var(--text);background:var(--bg2)}
  .pv-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
  .pv-cat{font-size:10px;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border);border-radius:4px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  .pv-selected .pv-cat{background:var(--bg3)}
  .pv-date{font-size:10px;color:var(--text3);white-space:nowrap;flex:0 0 auto}
  .pv-row{display:flex;gap:8px;align-items:flex-start}
  .pv-thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;flex:0 0 auto}
  .pv-text{font-size:12px;color:var(--text);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word;flex:1;min-width:0}
  .pv-muted{color:var(--text3)}
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()"></div>
</div>
<div class="layout" id="layout">
<div class="left-col" id="left-col">
<div class="sticky-header">
  <div class="header">
    <h1>コレクション</h1>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" id="trash-btn" onclick="toggleTrash()"></button>
      <button class="btn btn-sm" id="cat-mgr-btn" onclick="toggleCatPanel()"></button>
      <button class="btn btn-primary btn-sm" id="add-btn" onclick="addNote()"></button>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="内容・カテゴリーで検索…" oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()"></button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="sort-bar" id="sort-bar">
    <button class="sort-btn" id="sort-field-toggle" onclick="toggleSortField()">更新順</button>
    <button class="sort-btn" id="sort-dir" onclick="toggleSortDir()">降順</button>
    <span style="flex:0 0 8px"></span>
    <button class="sort-btn" id="filter-reset" onclick="resetDateFilter()">Clear</button>
    <select id="filter-year" class="sort-btn" onchange="onDateFilterChange()"><option value="">年</option></select>
    <select id="filter-month" class="sort-btn" onchange="onDateFilterChange()"><option value="">月</option></select>
    <select id="filter-day" class="sort-btn" onchange="onDateFilterChange()"><option value="">日</option></select>
    <span class="sort-btn" id="filter-dir-label" style="opacity:0.5;cursor:default;display:none"></span>
  </div>
</div>
<div class="app">
  <div class="sync-status" id="sync-status"></div>
  <div id="trash-panel" class="overlay" onclick="if(event.target===this)window.toggleTrash()"></div>
  <div id="cat-panel" class="overlay" onclick="if(event.target===this)window.toggleCatPanel()"></div>
  <div class="search-count" id="search-count"></div>
  <div class="cards" id="cards"></div>
</div>
</div>
<div class="detail-pane" id="detail-pane"></div>
</div>
<div class="bottom-bar" id="bottom-bar">
  <div class="bb-buttons" id="bb-buttons">
    <button id="bb-trash" onclick="toggleTrash()"></button>
    <button id="bb-cat" onclick="toggleCatPanel()"></button>
    <button id="bb-search" onclick="openBottomSearch()"></button>
    <button class="primary" id="bb-add" onclick="addNote()"></button>
  </div>
  <div class="bb-search-row" id="bb-search-row">
    <input type="text" id="bottom-search-input" placeholder="内容・カテゴリーで検索…" oninput="onSearch(this.value)">
    <button id="bb-search-close" onclick="closeBottomSearch()"></button>
  </div>
</div>

function destroyEditor(id) {
  if (editors[id]) {
    editors[id].destroy();
    delete editors[id];
  }
}

function destroyAllEditors() {
  Object.keys(editors).forEach(function(id) { destroyEditor(id); });
}

function bodyToHTML(body) {
  if (!body) return '';
  if (/<[a-z][\s\S]*>/i.test(body)) return body;
  return body.split('\n').map(function(line) {
    return '<p>' + esc(line) + '</p>';
  }).join('');
}

function htmlToPlainText(html) {
  if (!html) return '';
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function initEditor(id, body) {
  var el = document.getElementById('editor-' + id);
  if (!el) return;
  if (editors[id]) { editors[id].destroy(); }

  var htmlContent = bodyToHTML(body);

  var editor = new Editor({
    element: el,
    extensions: [
      StarterKit,
      Image.configure({
        inline: true,
        allowBase64: false,
        HTMLAttributes: {},
      }),
      Placeholder.configure({ placeholder: 'メモを入力…' }),
      Link.configure({
        autolink: true,
        linkOnPaste: true,
        openOnClick: false,
        protocols: ['https'],
        HTMLAttributes: { target: '_blank', rel: 'noopener nofollow' },
      }),
    ],
    content: htmlContent,
    editorProps: {
      handlePaste: function(view, event) {
        var cd = event.clipboardData;
        if (!cd) return false;
        var imageFile = null;
        var files = cd.files;
        for (var i = 0; files && i < files.length; i++) {
          if (files[i].type.indexOf('image') >= 0) { imageFile = files[i]; break; }
        }
        if (!imageFile) {
          var items = cd.items;
          for (var i = 0; items && i < items.length; i++) {
            if (items[i].kind === 'file' && items[i].type.indexOf('image') >= 0) {
              var f = items[i].getAsFile();
              if (f) { imageFile = f; break; }
            }
          }
        }
        if (!imageFile) {
          var plainText = cd.getData ? cd.getData('text/plain') : '';
          if (/\.(png|jpe?g|gif|webp|heic|tiff?|bmp)$/i.test((plainText || '').trim())) return true;
          // <a href> みたいなタグを含む「コードっぽい」テキストは、HTMLとして
          // 解釈させると山カッコごと消えてしまうので、文字そのままで挿入する。
          if (plainText && /<[a-zA-Z/!]/.test(plainText)) {
            event.preventDefault();
            var ed2 = editors[id];
            var lines = plainText.split(/\r?\n/);
            var content = [];
            lines.forEach(function(line, idx) {
              if (idx > 0) content.push({ type: 'hardBreak' });
              if (line) content.push({ type: 'text', text: line });
            });
            var startPos = ed2.state.selection.from;
            ed2.chain().focus().insertContent(content).run();
            // autolink が中の URL を拾ってコード全体をリンク化するのを打ち消す
            var endPos = ed2.state.selection.from;
            ed2.chain().setTextSelection({ from: startPos, to: endPos }).unsetLink().setTextSelection(endPos).run();
            return true;
          }
          return false;
        }
        event.preventDefault();
        var ed = editors[id];
        setSyncStatus('画像をアップロード中…');
        (async function() {
          try {
            var path = 'images/' + id + '/' + Date.now() + '_' + (imageFile.name || 'image.png');
            var storageRef = ref(storage, path);
            await uploadBytes(storageRef, imageFile);
            var url = await getDownloadURL(storageRef);
            ed.chain().focus().insertContent({ type: 'image', attrs: { src: url, alt: null, title: null } }).run();
            setSyncStatus('');
          } catch(err) {
            setSyncStatus('アップロードエラー');
            console.error(err);
          }
        })();
        return true;
      },
    },
    onUpdate: function({ editor }) {
      var html = editor.getHTML();
      var isEmpty = html === '<p></p>' || html === '';
      var saveVal = isEmpty ? '' : html;
      var b = byteLen(saveVal);
      if (b > 10000) {
        editor.commands.undo();
        return;
      }
      updateByteCount(id, saveVal);
      scheduleBodySave(id, saveVal);
      var n = notes.find(function(x){ return x.id === id; });
      if (n) n.body = saveVal;
    },
  });

  editors[id] = editor;

  var editorEl = document.getElementById('editor-' + id);
  if (editorEl) {
    editorEl.addEventListener('click', function(e) {
      var link = e.target.closest('a[href]');
      if (link) {
        e.preventDefault();
        e.stopPropagation();
        window.open(link.href, '_blank', 'noopener,noreferrer');
        return;
      }
      var img = e.target.closest('img');
      if (!img) return;
      e.preventDefault();
      e.stopPropagation();
      if (document.activeElement) document.activeElement.blur();
      var allImgs = Array.from(editorEl.querySelectorAll('img'))
        .map(function(i){ return i.src; })
        .filter(function(src){ return /^https?:\/\//.test(src); });
      var idx = allImgs.indexOf(img.src);
      _lbOpen(allImgs, idx < 0 ? 0 : idx);
    });
  }

  return editor;
}

function updateByteCount(id, val) {
  var card = document.getElementById('card-' + id);
  if (!card) return;
  var bc = card.querySelector('.byte-count');
  var footer = card.querySelector('.card-footer');
  var newBc = byteCountHTML(val);
  if (bc) bc.outerHTML = newBc || '<span></span>';
  else if (newBc && footer) footer.insertAdjacentHTML('beforeend', newBc);
}

window._tbH = function(id, level) {

async function loadCategories() {
  try {
    var snap = await getDocs(query(collection(db, CATS_COLL), orderBy('order', 'asc')));
    categories = snap.docs.map(function(d){ return d.data().name; });
    render();
    sortCategoriesByActivity();
  } catch(e) { console.error(e); }
}

async function sortCategoriesByActivity() {
  try {
    var times = {};
    await Promise.all(categories.map(async function(c) {
      var snap = await getDocs(query(collection(db, NOTES_COLL),
        where('cat', '==', c), where('deleted', '==', false),
        orderBy('updatedAt', 'desc'), limit(1)));
      var t = 0;
      if (snap.docs.length) {
        var ua = snap.docs[0].data().updatedAt;
        t = ua && ua.toMillis ? ua.toMillis() : 0;
      }
      times[c] = Math.max(t, _catFilterTimes[c] || 0);
    }));
    categories.sort(function(a, b){ return (times[b] || 0) - (times[a] || 0); });
    renderTabs();
  } catch(e) { console.error(e); }
}

async function saveCategoryToFirestore(name) {
  try {
    var snap = await getDocs(query(collection(db, CATS_COLL), orderBy('order','desc'), limit(1)));
    var maxOrder = snap.docs.length > 0 ? (snap.docs[0].data().order || 0) : 0;
    await addDoc(collection(db, CATS_COLL), { name: name, order: maxOrder + 1 });
  } catch(e) { console.error(e); }
}

async function deleteCategoryFromFirestore(name) {
  try {
    var snap = await getDocs(query(collection(db, CATS_COLL), where('name','==',name)));
    for (var d of snap.docs) { await deleteDoc(doc(db, CATS_COLL, d.id)); }
  } catch(e) { console.error(e); }
}

async function renameCategoryInFirestore(oldName, newName) {
  var csnap = await getDocs(query(collection(db, CATS_COLL), where('name','==',oldName)));
  for (var d of csnap.docs) { await setDoc(doc(db, CATS_COLL, d.id), { name: newName }, { merge: true }); }
  var nsnap = await getDocs(query(collection(db, NOTES_COLL), where('cat','==',oldName)));
  for (var nd of nsnap.docs) { await setDoc(doc(db, NOTES_COLL, nd.id), { cat: newName }, { merge: true }); }
}

function allTabs() {
  var t = categories.slice();
  t.unshift(NO_CAT);
  t.unshift(ALL_TAB);
  return t;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlight(text, query) {
  if (!query) return esc(text);
  var e = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(text).replace(new RegExp('(' + e + ')','gi'),'<mark>$1</mark>');
}

function setSyncStatus(msg) {
  document.getElementById('sync-status').textContent = msg;
}

var PAGE_SIZE = 30;
var lastDoc = null;
var hasMore = true;
var loading = false;

async function buildQuery(isNext) {
  var orderField = (filterYear && filterDir) ? 'date' : sortField;
  var constraints = [orderBy(orderField, sortDir)];
  if (currentCat !== ALL_TAB) {
    if (currentCat === NO_CAT) {
      constraints.push(where('deleted', '==', false));
    } else {
      constraints.push(where('cat', '==', currentCat));
      constraints.push(where('deleted', '==', false));
    }
  } else {
    constraints.push(where('deleted', '==', false));
  }
  if (filterYear && filterDir) {
    var m = filterMonth ? filterMonth : (filterDir === 'before' ? '12' : '01');
    var d = filterDay ? filterDay : (filterDir === 'before' ? '31' : '01');
    var dateStr = filterYear + '-' + m + '-' + d;
    if (filterDir === 'before') {
      constraints.push(where('date', '<=', dateStr));
    } else {
      constraints.push(where('date', '>=', dateStr));
    }
  }
  constraints.push(limit(PAGE_SIZE));
  if (isNext && lastDoc) constraints.push(startAfter(lastDoc));
  return query(collection(db, NOTES_COLL), ...constraints);
}

async function loadNotes(reset) {
  if (loading) return;
  if (!reset && !hasMore) return;
  loading = true;
  setSyncStatus('読み込み中…');
  try {
    if (reset) { lastDoc = null; hasMore = true; notes = []; destroyAllEditors(); }
    var q = await buildQuery(!reset);
    var snapshot = await getDocs(q);
    var newNotes = snapshot.docs.map(function(d) {
      var data = d.data();
      return { id: d.id, cat: data.cat || NO_CAT, body: data.body || '', date: data.date || '', deleted: data.deleted || false, images: data.images || [] };
    });
    if (reset) { notes = newNotes; } else { notes = notes.concat(newNotes); }
    if (snapshot.docs.length > 0) lastDoc = snapshot.docs[snapshot.docs.length - 1];
    hasMore = snapshot.docs.length === PAGE_SIZE;
    setSyncStatus('');
    render();
  } catch(e) {
    setSyncStatus('接続エラー');
    console.error(e);
  }
  loading = false;
}

var _searchSeq = 0;
var _searchMatchedCats = [];
var _scrollTabIntoView = false;
async function searchNotes(q2) {
  var seq = ++_searchSeq;
  setSyncStatus('検索中…');
  try {
    var url = 'https://' + ALGOLIA_APP_ID + '-dsn.algolia.net/1/indexes/' + ALGOLIA_INDEX + '/query';
    var res = await fetch(url, {
      method: 'POST',
      headers: {
        'X-Algolia-Application-Id': ALGOLIA_APP_ID,
        'X-Algolia-API-Key': ALGOLIA_SEARCH_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ query: q2, hitsPerPage: 500, attributesToRetrieve: ['objectID','body','cat','date'] })
    });
    if (seq !== _searchSeq) return;
    var data = await res.json();
    var lq = q2.toLowerCase();
    notes = (data.hits || []).map(function(h) {
      return { id: h.objectID, body: h.body || '', cat: h.cat || NO_CAT, date: h.date || '' };
    }).filter(function(n) {
      var plain = htmlToPlainText(n.body).toLowerCase();
      return plain.indexOf(lq) >= 0;
    });
    _searchMatchedCats = categories.filter(function(c){ return c.toLowerCase().indexOf(lq) >= 0; });
    setSyncStatus('');
    render();
  } catch(e) {
    if (seq !== _searchSeq) return;
    setSyncStatus('接続エラー');
    console.error(e);
  }
}

async function addNote() {
  var today = new Date().toISOString().slice(0,10);
  var cat = currentCat === ALL_TAB ? NO_CAT : currentCat;
  try {
    var docRef = await addDoc(collection(db, NOTES_COLL), {
      cat: cat,
      body: '',
      date: today,
      updatedAt: serverTimestamp(),
      deleted: false
    });
    currentCat = cat;
    selectedCardId = docRef.id;
    await loadNotes(true);
    var tries = 0;
    var focusNew = function() {
      var ed = editors[docRef.id];
      if (ed) { ed.commands.focus('end'); return; }
      if (tries++ < 10) setTimeout(focusNew, 100);
    };
    setTimeout(focusNew, 200);
  } catch(e) { console.error(e); }
}

function scheduleBodySave(id, val) {
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(async function() {
    try {
      await setDoc(doc(db, NOTES_COLL, id), { body: val, updatedAt: serverTimestamp() }, { merge: true });
    } catch(e) { console.error(e); }
  }, 800);
}

async function updateCatInDB(id, cat) {
  try {
    await setDoc(doc(db, NOTES_COLL, id), { cat: cat, updatedAt: serverTimestamp() }, { merge: true });
  } catch(e) { console.error(e); }
}

async function deleteNote(id) {
  var n = notes.find(function(x){ return x.id === id; });
  if (!n) return;
  trash.push(n);
  saveTrash(trash);
  notes = notes.filter(function(x){ return x.id !== id; });
  destroyEditor(id);
  render();
  try {
    await setDoc(doc(db, NOTES_COLL, id), { deleted: true, updatedAt: serverTimestamp() }, { merge: true });
  } catch(e) { console.error(e); }
}

function _setModalOpen(open) {
  document.body.style.overflow = open ? 'hidden' : '';
}
function openOverlay(html) {
  var m = document.getElementById('modal');
  m.style.cssText = '';
  m.innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  _setModalOpen(true);
}
function openOverlaySticky(topHtml, scrollHtml) {
  var m = document.getElementById('modal');
  m.style.cssText = 'display:flex;flex-direction:column;padding:0;height:80vh;min-height:80vh;overflow:hidden;flex-shrink:0';

}
function handleOverlayClick(e) {

function openCatModal(noteId) {
  currentNoteIdForCat = noteId;
  var n = notes.find(function(x){ return x.id === noteId; });
  if (!n) return;
  var current = n.cat || NO_CAT;
  var allCats = [NO_CAT].concat(categories);
  var rows = allCats.map(function(c) {
    var sel = c === current;
    return '<div class="cat-option' + (sel ? ' selected' : '') + '" onclick="window._selectCat(\'' + noteId + '\',\'' + esc(c) + '\')">'
      + esc(c)
      + (sel ? '<span style="color:var(--text2)">' + IC.check + '</span>' : '')
      + '</div>';
  }).join('');
  openOverlaySticky(
    '<div class="modal-header"><span class="modal-title">カテゴリーを選ぶ</span>'
    + '<button class="btn-icon" onclick="window._closeOv()">' + IC.x + '</button></div>'
    + '<div class="cat-modal-add" style="margin-bottom:0.75rem">'
    + '<input type="text" id="cat-modal-input" placeholder="検索 / 新規追加…" oninput="window._catModalFilter(this.value)">'
    + '<button class="btn btn-sm" onclick="window._addCatModal()">' + IC.plus + '</button>'
    + '</div>',
    rows
  );
  setTimeout(function(){ var el = document.getElementById('cat-modal-input'); if(el) el.focus(); }, 50);
}

window._closeOv = closeOverlay;
window._selectCat = function(noteId, cat) {
  updateCatInDB(noteId, cat);
  var n = notes.find(function(x){ return x.id === noteId; });
  if (n) n.cat = cat;
  closeOverlay();
  var btn = document.querySelector('#card-' + noteId + ' .cat-btn');
  if (btn) btn.textContent = cat;
};
window._catModalFilter = function(val) {
  var q = val.toLowerCase();
  document.querySelectorAll('#overlay .cat-option').forEach(function(el) {
    el.style.display = el.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
};
window._addCatModal = async function() {
  var el = document.getElementById('cat-modal-input');
  if (!el) return;
  var name = el.value.trim();
  if (!name || categories.indexOf(name) >= 0) return;
  categories.push(name);
  await saveCategoryToFirestore(name);
  if (currentNoteIdForCat) {
    updateCatInDB(currentNoteIdForCat, name);
    closeOverlay();
    render();
  }
};

function byteLen(s) { return new TextEncoder().encode(s).length; }
function byteCountHTML(body) {
  var b = byteLen(body);
  var cls = b >= 10000 ? 'over' : b >= 9000 ? 'warn' : '';
  if (!cls) return '';
  var msg = b >= 10000 ? '上限超過' : '上限まで' + (10000 - b) + 'B';
  return '<span class="byte-count ' + cls + '">' + msg + '</span>';
}

function cardHTML(n) {

  if (searchQuery) {

  } else {
    bodyEl = makeToolbar(n.id) + '<div class="card-editor" id="editor-' + n.id + '"></div>';

  return '<div class="card" id="card-' + n.id + '">'

    + '<button class="cat-btn" onclick="openCatModal(\'' + n.id + '\')">' + esc(n.cat || NO_CAT) + '</button>'
    + '<button class="btn-icon" onclick="deleteNote(\'' + n.id + '\')" title="ゴミ箱へ">' + IC.trash + '</button>'
    + '</div>'
    + bodyEl
    + '<div class="card-footer"><span class="card-date">' + esc(n.date) + '</span>' + bc + '</div>'
    + '</div>';
}

var _jkSelectedId = null;
function _jkIsTyping() {
  var a = document.activeElement;
  if (!a) return false;
  return a.isContentEditable || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA';
}
function _jkCards() {
  return Array.from(document.querySelectorAll('#cards .card'));
}
function _jkSelect(card) {
  _jkCards().forEach(function(c){ c.classList.remove('jk-selected'); });
  if (!card) { _jkSelectedId = null; return; }
  card.classList.add('jk-selected');
  _jkSelectedId = card.id;
  card.scrollIntoView({ block: 'nearest' });
}
function _jkMove(dir) {
  var cards = _jkCards();
  if (!cards.length) return;
  var idx = _jkSelectedId ? cards.findIndex(function(c){ return c.id === _jkSelectedId; }) : -1;
  var nextIdx;
  if (idx < 0) {
    nextIdx = dir > 0 ? 0 : cards.length - 1;
  } else {
    nextIdx = idx + dir;
    if (nextIdx < 0) nextIdx = 0;
    if (nextIdx >= cards.length) nextIdx = cards.length - 1;
  }
  _jkSelect(cards[nextIdx]);
}
document.addEventListener('keydown', function(e) {
  if (!e.metaKey && !e.ctrlKey && !e.altKey && (e.key === 'j' || e.key === 'k') && !_jkIsTyping()) {
    e.preventDefault();
    _jkMove(e.key === 'j' ? 1 : -1);
    return;
  }
  if (e.metaKey && !e.shiftKey && e.key === 'h') {
    var active = document.activeElement;
    var editorDiv = active && active.closest ? active.closest('.card-editor') : null;
    if (!editorDiv) return;
    var id = editorDiv.id.replace('editor-', '');
    var ed = editors[id];
    if (!ed) return;
    e.preventDefault();
    ed.chain().focus().toggleHeading({ level: 1 }).run();
    return;
  }
  if (e.metaKey && !e.shiftKey && e.key === 'v' && navigator.clipboard && navigator.clipboard.read) {
    var active2 = document.activeElement;
    var editorDiv2 = active2 && active2.closest ? active2.closest('.card-editor') : null;
    if (!editorDiv2) return;
    var id2 = editorDiv2.id.replace('editor-', '');
    var ed2 = editors[id2];
    if (!ed2) return;
    e.preventDefault();
    (async function() {
      try {
        var clipboardItems = await navigator.clipboard.read();
        var imageBlob = null;
        var htmlStr = null;
        for (var i = 0; i < clipboardItems.length; i++) {
          var types = clipboardItems[i].types;
          for (var j = 0; j < types.length; j++) {
            if (types[j].indexOf('image') >= 0) {
              imageBlob = await clipboardItems[i].getType(types[j]);
              break;
            }
          }
          if (imageBlob) break;
        }
        if (!imageBlob) {
          for (var i = 0; i < clipboardItems.length; i++) {
            if (clipboardItems[i].types.indexOf('text/html') >= 0) {
              var blob = await clipboardItems[i].getType('text/html');
              htmlStr = await blob.text();
              break;
            }
          }
          if (htmlStr) {
            var m = htmlStr.match(/<img[^>]+src=["'](data:image\/[^"']+)["']/i);
            if (m) {
              var dataUrl = m[1];
              var res = await fetch(dataUrl);
              imageBlob = await res.blob();
            }
          }
        }
        if (imageBlob) {
          setSyncStatus('画像をアップロード中…');
          var path = 'images/' + id2 + '/' + Date.now() + '_image.png';
          var storageRef = ref(storage, path);
          await uploadBytes(storageRef, imageBlob);
          var url = await getDownloadURL(storageRef);
          ed2.chain().focus().insertContent({ type: 'image', attrs: { src: url, alt: null, title: null } }).run();
          setSyncStatus('');
        } else {
          var text = await navigator.clipboard.readText().catch(function(){ return ''; });
          if (text) ed2.chain().focus().insertContent(text).run();
        }
      } catch(err) {
        console.error(err);
        setSyncStatus('アップロードエラー');
      }
    })();
  }
});

var _lbBg = null;
var _lbUrls = [];
var _lbIdx = 0;
var _lbTouchStartX = 0;
var _lbTouchDx = 0;
var _lbDragging = false;

var EASE = 'cubic-bezier(0.25,0.46,0.45,0.94)';

function _lbTrack() { return _lbBg ? _lbBg.querySelector('.lb-track') : null; }

function _lbSetPos(dx, animate) {
  var track = _lbTrack();
  if (!track) return;
  var base = -_lbIdx * 100;
  var offset = dx ? (dx / window.innerWidth * 100) : 0;
  track.style.transition = animate ? ('transform 0.32s ' + EASE) : 'none';
  track.style.transform = 'translateX(' + (base + offset) + 'vw)';
}

function _lbUpdateUI() {
  var counter = _lbBg.querySelector('.img-modal-counter');
  if (counter) counter.textContent = _lbUrls.length > 1 ? (_lbIdx + 1) + ' / ' + _lbUrls.length : '';
  var prev = _lbBg.querySelector('.img-modal-arrow.prev');
  var next = _lbBg.querySelector('.img-modal-arrow.next');
  if (prev) prev.disabled = _lbIdx === 0;
  if (next) next.disabled = _lbIdx === _lbUrls.length - 1;
}

function _lbGo(dir) {
  var newIdx = _lbIdx + dir;
  if (newIdx < 0 || newIdx >= _lbUrls.length) {
    _lbSetPos(dir > 0 ? -18 : 18, true);
    setTimeout(function(){ _lbSetPos(0, true); }, 20);
    return;
  }
  _lbIdx = newIdx;
  _lbSetPos(0, true);
  _lbUpdateUI();
}

function _lbClose() {
  if (_lbBg) { _lbBg.remove(); _lbBg = null; }
  document.body.style.overflow = '';
  document.removeEventListener('keydown', _lbKeyHandler);
}

function _lbKeyHandler(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { _lbGo(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { _lbGo(1); }
  else if (e.key === 'Escape') { _lbClose(); }
}

function _lbOpen(urls, idx) {
  if (!urls || !urls.length) return;
  _lbUrls = urls;
  _lbIdx = idx || 0;

  var bg = document.createElement('div');
  bg.className = 'img-modal-bg';

  var trackHTML = '<div class="lb-track">';
  for (var i = 0; i < urls.length; i++) {
    trackHTML += '<div class="lb-slide"><img src="' + urls[i] + '"></div>';
  }
  trackHTML += '</div>';

  bg.innerHTML = '<button class="img-modal-close" title="閉じる">×</button>'
    + (urls.length > 1 ? '<button class="img-modal-arrow prev">‹</button>' : '')
    + trackHTML
    + (urls.length > 1 ? '<button class="img-modal-arrow next">›</button>' : '')
    + '<div class="img-modal-counter"></div>';

  bg.querySelector('.img-modal-close').onclick = function(e){ e.stopPropagation(); _lbClose(); };
  bg.onclick = function(e){
    if (!e.target.closest('.lb-slide img, .img-modal-close, .img-modal-arrow, .img-modal-counter')) _lbClose();
  };

  var prev = bg.querySelector('.img-modal-arrow.prev');
  var next = bg.querySelector('.img-modal-arrow.next');
  if (prev) prev.onclick = function(e){ e.stopPropagation(); _lbGo(-1); };
  if (next) next.onclick = function(e){ e.stopPropagation(); _lbGo(1); };

  bg.addEventListener('touchstart', function(e){
    _lbTouchStartX = e.touches[0].clientX;
    _lbTouchDx = 0;
    _lbDragging = true;
    var track = _lbTrack();
    if (track) track.style.transition = 'none';
  }, { passive: true });

  bg.addEventListener('touchmove', function(e){
    if (!_lbDragging) return;
    _lbTouchDx = e.touches[0].clientX - _lbTouchStartX;
    var atStart = _lbIdx === 0 && _lbTouchDx > 0;
    var atEnd = _lbIdx === _lbUrls.length - 1 && _lbTouchDx < 0;
    var resistance = (atStart || atEnd) ? 0.2 : 1;
    _lbSetPos(_lbTouchDx * resistance, false);
  }, { passive: true });

  bg.addEventListener('touchend', function(e){
    if (!_lbDragging) return;
    _lbDragging = false;
    var threshold = window.innerWidth * 0.15;
    if (_lbTouchDx < -threshold) {
      _lbGo(1);
    } else if (_lbTouchDx > threshold) {
      _lbGo(-1);
    } else {
      _lbSetPos(0, true);
    }
  }, { passive: true });

  _lbBg = bg;
  document.body.style.overflow = 'hidden';
  document.body.appendChild(bg);
  _lbSetPos(0, false);
  _lbUpdateUI();
  document.addEventListener('keydown', _lbKeyHandler);
}

async function updateFilterCount() {

  if (key === _filterCountKey) return;
  _filterCountKey = key;
  try {
    var constraints = [where('deleted', '==', false)];
    if (currentCat !== ALL_TAB) constraints.push(where('cat', '==', currentCat));
    if (filterYear && filterDir) {
      var m = filterMonth ? filterMonth : (filterDir === 'before' ? '12' : '01');
      var d = filterDay ? filterDay : (filterDir === 'before' ? '31' : '01');
      var dateStr = filterYear + '-' + m + '-' + d;
      constraints.push(where('date', filterDir === 'before' ? '<=' : '>=', dateStr));
    }
    var snap = await getCountFromServer(query(collection(db, NOTES_COLL), ...constraints));
    if (searchQuery || key !== _filterCountKey) return;
    countEl.textContent = snap.data().count + '件';
  } catch(e) { console.error(e); _filterCountKey = null; }
}

      + '<button class="btn-icon" onclick="window._editCatStart(' + idx + ')" title="名前を編集">' + IC.edit + '</button>'
      + '<button class="btn-icon" onclick="window._deleteCat(' + idx + ')"'
      + (count > 0 ? ' disabled style="opacity:0.3;cursor:not-allowed"' : '')
      + '>' + IC.trash + '</button></div>';
  }).join('');
  el.innerHTML = '<div class="modal" style="display:flex;flex-direction:column;padding:0;height:80vh;min-height:80vh;overflow:hidden;flex-shrink:0">'
    + '<div style="padding:1.25rem 1.25rem 0">'
    + '<div class="modal-header"><span class="modal-title">カテゴリー管理</span>'
    + '<button class="btn-icon" onclick="window.toggleCatPanel()">' + IC.x + '</button></div>'
    + '<div class="cat-add-row" style="margin-bottom:0.5rem"><input type="text" id="new-cat-input" placeholder="新しいカテゴリー名…">'
    + '<button class="btn btn-sm" onclick="window._addCat()">' + IC.plus + ' 追加</button></div>'
    + '<input type="text" id="cat-panel-search" placeholder="検索…" oninput="window._catPanelFilter(this.value)" style="width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none;margin-bottom:0.75rem">'
    + '</div>'
    + '<div style="overflow-y:auto;padding:0 1.25rem 1.25rem">' + rows + '</div>'
    + '</div>';
  el.classList.add('open');
  _setModalOpen(true);
}

window._catPanelFilter = function(val) {
  var q = val.toLowerCase();
  document.querySelectorAll('#cat-panel .cat-row').forEach(function(el) {
    el.style.display = el.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
};
window._deleteCat = async function(idx) {
  var name = categories[idx];
  if (name == null) return;
  categories = categories.filter(function(c){ return c !== name; });
  if (currentCat === name) currentCat = ALL_TAB;
  await deleteCategoryFromFirestore(name);
  render();
};
window._catPanelGoto = function(idx) {
  var name = categories[idx];
  if (name == null) return;
  catPanelOpen = false;
  switchCat(name);
};
window._editCatStart = function(idx) {
  var oldName = categories[idx];
  if (oldName == null) return;
  var row = document.querySelector('#cat-panel .cat-row[data-idx="' + idx + '"]');
  if (!row) return;
  row.innerHTML = '<input type="text" class="cat-edit-input" value="' + esc(oldName) + '" style="flex:1;min-width:0;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:6px 10px;font-size:14px;color:var(--text);font-family:inherit;outline:none">'
    + '<button class="btn-icon" onclick="window._renameCat(' + idx + ')" title="保存">' + IC.check + '</button>'
    + '<button class="btn-icon" onclick="window.renderCatPanel()" title="キャンセル">' + IC.x + '</button>';
  var inp = row.querySelector('.cat-edit-input');
  inp.focus();
  inp.select();
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); window._renameCat(idx); }
    else if (e.key === 'Escape') { e.preventDefault(); window.renderCatPanel(); }
  });
};
window._renameCat = async function(idx) {
  var oldName = categories[idx];
  var row = document.querySelector('#cat-panel .cat-row[data-idx="' + idx + '"]');
  var inp = row ? row.querySelector('.cat-edit-input') : null;
  if (oldName == null || !inp) return;
  var newName = inp.value.trim();
  if (!newName || newName === oldName) { renderCatPanel(); return; }
  if (categories.indexOf(newName) >= 0) { inp.focus(); inp.select(); setSyncStatus('同名のカテゴリーが既にある'); return; }
  setSyncStatus('カテゴリー名を変更中…');
  try {
    await renameCategoryInFirestore(oldName, newName);
    categories[idx] = newName;
    if (_catFilterTimes[oldName] != null) {
      _catFilterTimes[newName] = _catFilterTimes[oldName];
      delete _catFilterTimes[oldName];
      try { localStorage.setItem('catFilterTimes', JSON.stringify(_catFilterTimes)); } catch(e) {}
    }
    if (currentCat === oldName) currentCat = newName;
    setSyncStatus('');
  } catch(e) { setSyncStatus('変更エラー'); console.error(e); }
  await renderCatPanel();
};
window.renderCatPanel = renderCatPanel;
window._addCat = async function() {
  var el = document.getElementById('new-cat-input');
  if (!el) return;
  var name = el.value.trim();
  if (!name || categories.indexOf(name) >= 0) return;
  categories.push(name);
  await saveCategoryToFirestore(name);
  currentCat = name;
  render();
};
function addCatInline() {
  var div = document.createElement('div');
  div.innerHTML = '<div class="modal-header">'
    + '<span class="modal-title">カテゴリーを追加</span>'
    + '<button class="btn-icon" id="cat-inline-close">' + IC.x + '</button>'
    + '</div>'
    + '<div class="cat-modal-add" style="margin-top:0;padding-top:0;border-top:none">'
    + '<input type="text" id="cat-inline-input" placeholder="カテゴリー名...">'
    + '<button class="btn btn-sm" id="cat-inline-submit">' + IC.plus + '</button>'
    + '</div>';
  document.getElementById('modal').innerHTML = '';
  document.getElementById('modal').appendChild(div);
  document.getElementById('overlay').classList.add('open');
  var input = document.getElementById('cat-inline-input');
  var submit = function() {
    var name = input.value.trim();
    if (!name || categories.indexOf(name) >= 0) { closeOverlay(); return; }
    categories.push(name);
    currentCat = name;
    closeOverlay();
    render();
  };
  document.getElementById('cat-inline-close').addEventListener('click', closeOverlay);
  document.getElementById('cat-inline-submit').addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
  setTimeout(function(){ input.focus(); }, 50);
}
window.addCatInline = addCatInline;
window.addNote = addNote;

document.getElementById('tabs').addEventListener('wheel', function(e) {
  e.preventDefault();
  this.scrollLeft += e.deltaY || e.deltaX;
}, {passive: false});

window.handleOverlayClick = handleOverlayClick;
setSyncStatus('接続中…');

</script>
</body>
</html>
