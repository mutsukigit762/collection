<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>メモ</title>
<link rel="apple-touch-icon" href="apple-touch-icon-collection.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#f0ede8;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#aaa;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --radius:8px;--radius-lg:12px;
  --warning-bg:#fef9c3;--warning-text:#854d0e;
  --danger:#dc2626;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;
    --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);
    --warning-bg:#422006;--warning-text:#fbbf24;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;overflow-anchor:none}
.sticky-header{position:sticky;top:0;z-index:10;background:var(--bg3);max-width:600px;margin:0 auto;padding:1rem 1rem 0}
.app{max-width:600px;margin:0 auto;padding:0 1rem 1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.header h1{font-size:20px;font-weight:600}
.btn{background:transparent;border:0.5px solid var(--border2);border-radius:var(--radius);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-sm{padding:4px 8px;font-size:12px}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-icon{padding:4px;border:none;background:none;cursor:pointer;color:var(--text3);display:inline-flex;align-items:center;border-radius:4px}
.btn-icon:hover{color:var(--danger);background:rgba(220,38,38,0.08)}
.search-wrap{position:relative;margin-bottom:1rem}
.search-wrap input{width:100%;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:9px 32px 9px 12px;font-size:14px;color:var(--text);font-family:inherit;outline:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);display:none;padding:2px}
.tabs{display:flex;margin-bottom:1.25rem;border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.tab:hover{color:var(--text)}
.tab-add{padding:8px 10px;font-size:13px;cursor:pointer;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;font-family:inherit}
.tab-add:hover{color:var(--text)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:0.875rem 1rem}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.cat-btn{font-size:11px;color:var(--text2);background:var(--bg2);border:0.5px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer;font-family:inherit;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.cat-btn:hover{border-color:var(--border2)}
.card-textarea{width:100%;background:transparent;border:none;outline:none;font-size:14px;color:var(--text);font-family:inherit;line-height:1.6;resize:none;min-height:40px;padding:0}
.card-textarea::placeholder{color:var(--text3)}
.card-body-view{width:100%;font-size:14px;color:var(--text);line-height:1.6;white-space:pre-wrap;word-break:break-word;cursor:text;min-height:40px}
.card-body-view mark{background:#f59e0b;color:#000;border-radius:2px;padding:0 1px}
.card-date{font-size:11px;color:var(--text3);margin-top:6px}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.byte-count{font-size:11px;color:var(--text3)}
.byte-count.warn{color:#f59e0b}
.byte-count.over{color:var(--danger);font-weight:500}
mark{background:var(--warning-bg);color:var(--warning-text);border-radius:2px;padding:0 1px}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2);font-size:14px}
.search-count{font-size:12px;color:var(--text3);margin-bottom:1rem}
.panel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:1rem}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.panel-title{font-size:15px;font-weight:500}
.trash-item{padding:10px 0;border-bottom:0.5px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.trash-item:last-child{border-bottom:none}
.trash-item-body{flex:1;font-size:13px;color:var(--text2);line-height:1.5}
.trash-item-meta{font-size:11px;color:var(--text3);margin-top:2px}
.cat-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-add-row{display:flex;gap:8px;margin-top:1rem}
.cat-add-row input{flex:1;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;padding:1rem}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg);border-radius:var(--radius-lg);padding:1.25rem;width:100%;max-width:360px;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.modal-title{font-size:15px;font-weight:500}
.cat-option{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px}
.cat-option:hover{background:var(--bg2)}
.cat-option.selected{font-weight:500;background:var(--bg2)}
.cat-modal-add{display:flex;gap:8px;margin-top:0.75rem;padding-top:0.75rem;border-top:0.5px solid var(--border)}
.cat-modal-add input{flex:1;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.sync-status{font-size:11px;color:var(--text3);text-align:right;padding:0 0 6px}
svg.icon{display:inline-block;vertical-align:-3px;flex-shrink:0}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()"></div>
</div>
<div class="sticky-header">
  <div class="header">
    <h1>メモ</h1>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm" id="trash-btn" onclick="toggleTrash()"></button>
      <button class="btn btn-sm" id="cat-mgr-btn" onclick="toggleCatPanel()"></button>
      <button class="btn btn-primary btn-sm" id="add-btn" onclick="addNote()"></button>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="内容・カテゴリーで検索…" oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()"></button>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="app">
  <div class="sync-status" id="sync-status"></div>
  <div id="trash-panel" style="display:none"></div>
  <div id="cat-panel" style="display:none"></div>
  <div class="search-count" id="search-count"></div>
  <div class="cards" id="cards"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot, query, where, orderBy, limit, startAfter, getDocs, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCy2qi8vFTqlqjc0VBd8GEbuh6FO0fhs9w",
  authDomain: "memo-ce334.firebaseapp.com",
  projectId: "memo-ce334",
  storageBucket: "memo-ce334.firebasestorage.app",
  messagingSenderId: "732811990086",
  appId: "1:732811990086:web:5b69ceb89f80cae7f9a647",
  measurementId: "G-DF3Z087VMQ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const NOTES_COLL = 'collection_notes';
const CATS_COLL = 'collection_categories';
const ALGOLIA_APP_ID = 'J90KE9AP6P';
const ALGOLIA_SEARCH_KEY = 'dcd2d9c7819580a05c4e61dbe07d2046';
const ALGOLIA_INDEX = 'collection_notes';

const IC = {
  x: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  plus: '<svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>',
  restore: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>',
  folder: '<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  check: '<svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  inboxLg: '<svg class="icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 8px"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
  searchLg: '<svg class="icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 8px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
};

document.getElementById('trash-btn').innerHTML = IC.trash + ' ゴミ箱';
document.getElementById('cat-mgr-btn').innerHTML = IC.folder + ' カテゴリー';
document.getElementById('add-btn').innerHTML = IC.plus + ' 追加';
document.querySelector('.search-clear').innerHTML = IC.x;

const NO_CAT = 'カテゴリなし';
const ALL_TAB = 'すべて';
const TRASH_KEY = 'collection_trash_local';

// ゴミ箱はlocalStorageで管理
function loadTrash() {
  try { return JSON.parse(localStorage.getItem(TRASH_KEY)) || []; } catch(e) { return []; }
}
function saveTrash(t) { localStorage.setItem(TRASH_KEY, JSON.stringify(t)); }

// カテゴリはFirestoreから読み込む
var categories = [];
var trash = loadTrash();
var notes = [];
var currentCat = ALL_TAB;
var searchQuery = '';
var trashOpen = false;
var catPanelOpen = false;
var currentNoteIdForCat = null;
var saveTimers = {};

async function loadCategories() {
  try {
    var snap = await getDocs(query(collection(db, CATS_COLL), orderBy('order', 'asc')));
    categories = snap.docs.map(function(d){ return d.data().name; });
    render();
  } catch(e) { console.error(e); }
}

async function saveCategoryToFirestore(name) {
  try {
    var snap = await getDocs(query(collection(db, CATS_COLL), orderBy('order','desc'), limit(1)));
    var maxOrder = snap.docs.length > 0 ? (snap.docs[0].data().order || 0) : 0;
    await addDoc(collection(db, CATS_COLL), { name: name, order: maxOrder + 1 });
  } catch(e) { console.error(e); }
}

async function deleteCategoryFromFirestore(name) {
  try {
    var snap = await getDocs(query(collection(db, CATS_COLL), where('name','==',name)));
    for (var d of snap.docs) { await deleteDoc(doc(db, CATS_COLL, d.id)); }
  } catch(e) { console.error(e); }
}

function allTabs() {
  var t = categories.slice();
  t.unshift(NO_CAT);
  t.unshift(ALL_TAB);
  return t;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlight(text, query) {
  if (!query) return esc(text);
  var e = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(text).replace(new RegExp('(' + e + ')','gi'),'<mark>$1</mark>');
}

function setSyncStatus(msg) {
  document.getElementById('sync-status').textContent = msg;
}

// ページネーション
var PAGE_SIZE = 30;
var lastDoc = null;
var hasMore = true;
var loading = false;

async function buildQuery(isNext) {
  var constraints = [orderBy('updatedAt','desc')];
  if (currentCat !== ALL_TAB) {
    var catVal = currentCat === NO_CAT ? NO_CAT : currentCat;
    constraints.push(where('cat', '==', catVal));
    constraints.push(where('deleted', '==', false));
  } else {
    constraints.push(where('deleted', '==', false));
  }
  constraints.push(limit(PAGE_SIZE));
  if (isNext && lastDoc) constraints.push(startAfter(lastDoc));
  return query(collection(db, NOTES_COLL), ...constraints);
}

async function loadNotes(reset) {
  if (loading) return;
  if (!reset && !hasMore) return;
  loading = true;
  setSyncStatus('読み込み中…');
  try {
    if (reset) { lastDoc = null; hasMore = true; notes = []; }
    var q = await buildQuery(!reset);
    var snapshot = await getDocs(q);
    var newNotes = snapshot.docs.map(function(d) {
      var data = d.data();
      return { id: d.id, cat: data.cat || NO_CAT, body: data.body || '', date: data.date || '', deleted: data.deleted || false };
    });
    if (reset) { notes = newNotes; } else { notes = notes.concat(newNotes); }
    if (snapshot.docs.length > 0) lastDoc = snapshot.docs[snapshot.docs.length - 1];
    hasMore = snapshot.docs.length === PAGE_SIZE;
    setSyncStatus('');
    render();
  } catch(e) {
    setSyncStatus('接続エラー');
    console.error(e);
  }
  loading = false;
}

async function searchNotes(q2) {
  setSyncStatus('検索中…');
  try {
    var url = 'https://' + ALGOLIA_APP_ID + '-dsn.algolia.net/1/indexes/' + ALGOLIA_INDEX + '/query';
    var res = await fetch(url, {
      method: 'POST',
      headers: {
        'X-Algolia-Application-Id': ALGOLIA_APP_ID,
        'X-Algolia-API-Key': ALGOLIA_SEARCH_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ query: q2, hitsPerPage: 500, attributesToRetrieve: ['objectID','body','cat','date'] })
    });
    var data = await res.json();
    var lq = q2.toLowerCase();
    notes = (data.hits || []).map(function(h) {
      return { id: h.objectID, body: h.body || '', cat: h.cat || NO_CAT, date: h.date || '' };
    }).filter(function(n) {
      return n.body.toLowerCase().indexOf(lq) >= 0 || n.cat.toLowerCase().indexOf(lq) >= 0;
    });
    setSyncStatus('');
    render();
  } catch(e) {
    setSyncStatus('接続エラー');
    console.error(e);
  }
}

// 初回読み込み
loadCategories();
loadNotes(true);

// スクロールで追加読み込み
window.addEventListener('scroll', function() {
  if (searchQuery) return;
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
    loadNotes(false);
  }
});

// ノード操作
async function addNote() {
  var today = new Date().toISOString().slice(0,10);
  var cat = currentCat === ALL_TAB ? NO_CAT : currentCat;
  try {
    var ref = await addDoc(collection(db, NOTES_COLL), {
      cat: cat,
      body: '',
      date: today,
      updatedAt: serverTimestamp(),
      deleted: false
    });
    currentCat = cat;
    await loadNotes(true);
    setTimeout(function() {
      var ta = document.querySelector('#card-' + ref.id + ' .card-textarea');
      if (ta) ta.focus();
    }, 300);
  } catch(e) { console.error(e); }
}

function scheduleBodySave(id, val) {
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(async function() {
    try {
      await setDoc(doc(db, NOTES_COLL, id), { body: val, updatedAt: serverTimestamp() }, { merge: true });
    } catch(e) { console.error(e); }
  }, 800);
}

async function updateCatInDB(id, cat) {
  try {
    await setDoc(doc(db, NOTES_COLL, id), { cat: cat, updatedAt: serverTimestamp() }, { merge: true });
  } catch(e) { console.error(e); }
}

async function deleteNote(id) {
  var n = notes.find(function(x){ return x.id === id; });
  if (!n) return;
  trash.push(n);
  saveTrash(trash);
  notes = notes.filter(function(x){ return x.id !== id; });
  render();
  try {
    await setDoc(doc(db, NOTES_COLL, id), { deleted: true, updatedAt: serverTimestamp() }, { merge: true });
  } catch(e) { console.error(e); }
}

// overlay
function openOverlay(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeOverlay();
}

// カテゴリモーダル
function openCatModal(noteId) {
  currentNoteIdForCat = noteId;
  var n = notes.find(function(x){ return x.id === noteId; });
  if (!n) return;
  var current = n.cat || NO_CAT;
  var allCats = [NO_CAT].concat(categories);
  var rows = allCats.map(function(c) {
    var sel = c === current;
    return '<div class="cat-option' + (sel ? ' selected' : '') + '" onclick="window._selectCat(\'' + noteId + '\',\'' + esc(c) + '\')">'
      + esc(c)
      + (sel ? '<span style="color:var(--text2)">' + IC.check + '</span>' : '')
      + '</div>';
  }).join('');
  openOverlay(
    '<div class="modal-header"><span class="modal-title">カテゴリーを選ぶ</span>'
    + '<button class="btn-icon" onclick="window._closeOv()">' + IC.x + '</button></div>'
    + rows
    + '<div class="cat-modal-add">'
    + '<input type="text" id="cat-modal-input" placeholder="新しいカテゴリー…">'
    + '<button class="btn btn-sm" onclick="window._addCatModal()">' + IC.plus + '</button>'
    + '</div>'
  );
}

window._closeOv = closeOverlay;
window._selectCat = function(noteId, cat) {
  updateCatInDB(noteId, cat);
  var n = notes.find(function(x){ return x.id === noteId; });
  if (n) n.cat = cat;
  closeOverlay();
  var btn = document.querySelector('#card-' + noteId + ' .cat-btn');
  if (btn) btn.textContent = cat;
};
window._addCatModal = async function() {
  var el = document.getElementById('cat-modal-input');
  if (!el) return;
  var name = el.value.trim();
  if (!name || categories.indexOf(name) >= 0) return;
  categories.push(name);
  await saveCategoryToFirestore(name);
  if (currentNoteIdForCat) {
    updateCatInDB(currentNoteIdForCat, name);
    closeOverlay();
    render();
  }
};

// カード描画
function byteLen(s) { return new TextEncoder().encode(s).length; }
function byteCountHTML(body) {
  var b = byteLen(body);
  var cls = b >= 10000 ? 'over' : b >= 9000 ? 'warn' : '';
  if (!cls) return '';
  var msg = b >= 10000 ? '上限超過' : '上限まで' + (10000 - b) + 'B';
  return '<span class="byte-count ' + cls + '">' + msg + '</span>';
}
function cardHTML(n) {
  var bc = byteCountHTML(n.body || '');
  var bodyEl;
  if (searchQuery) {
    // 検索時はハイライト付きの読み取り表示。タップで編集モードに切り替え
    bodyEl = '<div class="card-body-view" onclick="enterEdit(this,\'' + n.id + '\')">' + highlight(n.body || '', searchQuery.toLowerCase()) + '</div>';
  } else {
    bodyEl = '<textarea class="card-textarea" rows="1" onfocus="onCardFocus(this,\'' + n.id + '\')" oninput="onCardInput(this,\'' + n.id + '\')" placeholder="メモを入力…">' + esc(n.body) + '</textarea>';
  }
  return '<div class="card" id="card-' + n.id + '">'
    + '<div class="card-top">'
    + '<button class="cat-btn" onclick="openCatModal(\'' + n.id + '\')">' + esc(n.cat || NO_CAT) + '</button>'
    + '<button class="btn-icon" onclick="deleteNote(\'' + n.id + '\')" title="ゴミ箱へ">' + IC.trash + '</button>'
    + '</div>'
    + bodyEl
    + '<div class="card-footer"><span class="card-date">' + esc(n.date) + '</span>' + bc + '</div>'
    + '</div>';
}

function autoResize(el) {
  var sy = window.scrollY;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
  if (window.scrollY !== sy) window.scrollTo(0, sy);
}
// 検索結果の読み取り表示をタップしたら編集モードに切り替え
async function enterEdit(viewEl, id) {
  var card = viewEl.closest('.card');
  if (!card) return;
  var ta = document.createElement('textarea');
  ta.className = 'card-textarea';
  ta.rows = 1;
  ta.placeholder = 'メモを入力…';
  var n = notes.find(function(x){ return x.id === id; });
  ta.value = n ? (n.body || '') : '';
  viewEl.replaceWith(ta);
  ta.oninput = function(){ onCardInput(ta, id); };
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  ta.focus();
  // Firestoreから完全版を取得（Algoliaのbodyは切り詰めの可能性）
  try {
    var snap = await getDoc(doc(db, NOTES_COLL, id));
    if (snap.exists()) {
      var fullBody = snap.data().body || '';
      if (fullBody !== ta.value) {
        ta.value = fullBody;
        if (n) n.body = fullBody;
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
      }
    }
  } catch(e) { console.error(e); }
}

function onCardInput(el, id) {
  var b = byteLen(el.value);
  if (b > 10000) {
    // 10KB超えたら超えた分を削除
    var val = el.value;
    while (byteLen(val) > 10000) val = val.slice(0, -1);
    el.value = val;
  }
  autoResize(el);
  // byte-countを更新
  var card = el.closest('.card');
  if (card) {
    var bc = card.querySelector('.byte-count');
    var footer = card.querySelector('.card-footer');
    var newBc = byteCountHTML(el.value);
    if (bc) bc.outerHTML = newBc || '';
    else if (newBc && footer) footer.insertAdjacentHTML('beforeend', newBc);
  }
  scheduleBodySave(id, el.value);
}
// 検索結果のカードはAlgoliaの切り詰めbodyの可能性があるので、編集開始時にFirestoreの完全版を読み込む
async function onCardFocus(el, id) {
  if (!searchQuery) return;
  if (el.dataset.full === '1') return;
  try {
    var snap = await getDoc(doc(db, NOTES_COLL, id));
    if (snap.exists()) {
      var fullBody = snap.data().body || '';
      if (fullBody !== el.value) {
        var sy = window.scrollY;
        el.value = fullBody;
        autoResize(el);
        window.scrollTo(0, sy);
      }
    }
    el.dataset.full = '1';
  } catch(e) { console.error(e); }
}

function renderTabs() {
  var t = document.getElementById('tabs');
  if (searchQuery) { t.innerHTML = ''; return; }
  var tabs = allTabs();
  t.innerHTML = tabs.map(function(c) {
    return '<button class="tab' + (c === currentCat ? ' active' : '') + '" onclick="switchCat(\'' + esc(c) + '\')">' + esc(c) + '</button>';
  }).join('') + '<button class="tab-add" onclick="addCatInline()">' + IC.plus + '</button>';
}

function renderCards() {
  var el = document.getElementById('cards');
  var countEl = document.getElementById('search-count');
  if (searchQuery) {
    var found = notes;
    countEl.textContent = found.length + '件ヒット';
    el.innerHTML = found.length
      ? found.map(function(n){ return cardHTML(n); }).join('')
      : '<div class="empty">' + IC.searchLg + '見つからなかった</div>';
    el.querySelectorAll('.card-textarea').forEach(function(ta) {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
    return;
  }
  countEl.textContent = '';
  var filtered = notes.filter(function(n) {
    if (currentCat === ALL_TAB) return true;
    if (currentCat === NO_CAT) return !n.cat || n.cat === NO_CAT;
    return n.cat === currentCat;
  });
  el.innerHTML = filtered.length
    ? filtered.map(function(n){ return cardHTML(n); }).join('')
    : '<div class="empty">' + IC.inboxLg + 'まだ何もない</div>';
  el.querySelectorAll('.card-textarea').forEach(function(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });
}

function render() {
  var tabs = allTabs();
  if (tabs.indexOf(currentCat) < 0) currentCat = tabs[0] || ALL_TAB;
  renderTabs();
  renderCards();
  renderTrash();
  renderCatPanel();
}

function switchCat(c) { currentCat = c; loadNotes(true); }
function onSearch(val) {
  searchQuery = val.trim();
  document.getElementById('search-clear').style.display = val ? 'block' : 'none';
  if (searchQuery) {
    searchNotes(searchQuery);
  } else {
    loadNotes(true);
  }
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('search-clear').style.display = 'none';
  loadNotes(true);
  document.getElementById('search-input').focus();
}

// グローバルに公開
window.openCatModal = openCatModal;
window.deleteNote = deleteNote;
window.scheduleBodySave = scheduleBodySave;
window.autoResize = autoResize;
window.onCardInput = onCardInput;
window.onCardFocus = onCardFocus;
window.enterEdit = enterEdit;
window.switchCat = switchCat;
window.onSearch = onSearch;
window.clearSearch = clearSearch;

// ゴミ箱
function toggleTrash() { trashOpen = !trashOpen; catPanelOpen = false; render(); }
window.toggleTrash = toggleTrash;

function renderTrash() {
  var el = document.getElementById('trash-panel');
  if (!trashOpen) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  var items = trash;
  var rows = items.length
    ? items.slice().reverse().map(function(n) {
        return '<div class="trash-item">'
          + '<div style="flex:1"><div class="trash-item-body">' + esc((n.body||'').slice(0,60)) + ((n.body||'').length > 60 ? '…' : '') + '</div>'
          + '<div class="trash-item-meta">' + esc(n.cat || NO_CAT) + ' · ' + esc(n.date) + '</div></div>'
          + '<div style="display:flex;gap:4px">'
          + '<button class="btn-icon" onclick="window._restoreNote(\'' + n.id + '\')" title="元に戻す">' + IC.restore + '</button>'
          + '<button class="btn-icon" onclick="window._hardDelete(\'' + n.id + '\')" title="完全削除">' + IC.trash + '</button>'
          + '</div></div>';
      }).join('')
    : '<div style="text-align:center;padding:1rem;color:var(--text3);font-size:13px">ゴミ箱は空</div>';
  var emptyAll = items.length
    ? '<div style="display:flex;justify-content:flex-end;margin-top:0.75rem"><button class="btn btn-sm btn-danger" onclick="window._emptyTrash()">' + IC.trash + ' すべて完全削除</button></div>'
    : '';
  el.innerHTML = '<div class="panel"><div class="panel-header"><span class="panel-title">ゴミ箱 <span style="font-size:13px;color:var(--text3);font-weight:400">' + items.length + '件</span></span>'
    + '<button class="btn-icon" onclick="window.toggleTrash()">' + IC.x + '</button></div>'
    + rows + emptyAll + '</div>';
}

window._restoreNote = async function(id) {
  var n = trash.find(function(x){ return x.id === id; });
  if (!n) return;
  trash = trash.filter(function(x){ return x.id !== id; });
  saveTrash(trash);
  try {
    await setDoc(doc(db, NOTES_COLL, id), { deleted: false, updatedAt: serverTimestamp() }, { merge: true });
  } catch(e) { console.error(e); }
  render();
};
window._hardDelete = async function(id) {
  trash = trash.filter(function(x){ return x.id !== id; });
  saveTrash(trash);
  try {
    await deleteDoc(doc(db, NOTES_COLL, id));
  } catch(e) { console.error(e); }
  renderTrash();
};
window._emptyTrash = async function() {
  var ids = trash.map(function(n){ return n.id; });
  trash = [];
  saveTrash(trash);
  for (var i = 0; i < ids.length; i++) {
    try { await deleteDoc(doc(db, NOTES_COLL, ids[i])); } catch(e) {}
  }
  renderTrash();
};

// カテゴリ管理パネル
function toggleCatPanel() { catPanelOpen = !catPanelOpen; trashOpen = false; render(); }
window.toggleCatPanel = toggleCatPanel;

function renderCatPanel() {
  var el = document.getElementById('cat-panel');
  if (!catPanelOpen) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  var rows = categories.map(function(c) {
    var count = notes.filter(function(n){ return n.cat === c; }).length;
    return '<div class="cat-row"><span style="font-size:14px">' + esc(c)
      + ' <span style="font-size:12px;color:var(--text3)">' + count + '件</span></span>'
      + '<button class="btn-icon" onclick="window._deleteCat(\'' + esc(c) + '\')"'
      + (count > 0 ? ' disabled style="opacity:0.3;cursor:not-allowed"' : '')
      + '>' + IC.trash + '</button></div>';
  }).join('');
  el.innerHTML = '<div class="panel"><div class="panel-header"><span class="panel-title">カテゴリー管理</span>'
    + '<button class="btn-icon" onclick="window.toggleCatPanel()">' + IC.x + '</button></div>'
    + rows
    + '<div class="cat-add-row"><input type="text" id="new-cat-input" placeholder="新しいカテゴリー名…">'
    + '<button class="btn btn-sm" onclick="window._addCat()">' + IC.plus + ' 追加</button></div>'
    + '</div>';
}

window._deleteCat = async function(name) {
  categories = categories.filter(function(c){ return c !== name; });
  if (currentCat === name) currentCat = ALL_TAB;
  await deleteCategoryFromFirestore(name);
  render();
};
window._addCat = async function() {
  var el = document.getElementById('new-cat-input');
  if (!el) return;
  var name = el.value.trim();
  if (!name || categories.indexOf(name) >= 0) return;
  categories.push(name);
  await saveCategoryToFirestore(name);
  currentCat = name;
  render();
};
function addCatInline() {
  var div = document.createElement('div');
  div.innerHTML = '<div class="modal-header">'
    + '<span class="modal-title">カテゴリーを追加</span>'
    + '<button class="btn-icon" id="cat-inline-close">' + IC.x + '</button>'
    + '</div>'
    + '<div class="cat-modal-add" style="margin-top:0;padding-top:0;border-top:none">'
    + '<input type="text" id="cat-inline-input" placeholder="カテゴリー名...">'
    + '<button class="btn btn-sm" id="cat-inline-submit">' + IC.plus + '</button>'
    + '</div>';
  document.getElementById('modal').innerHTML = '';
  document.getElementById('modal').appendChild(div);
  document.getElementById('overlay').classList.add('open');
  var input = document.getElementById('cat-inline-input');
  var submit = function() {
    var name = input.value.trim();
    if (!name || categories.indexOf(name) >= 0) { closeOverlay(); return; }
    categories.push(name);
    saveTrash(trash);
    currentCat = name;
    closeOverlay();
    render();
  };
  document.getElementById('cat-inline-close').addEventListener('click', closeOverlay);
  document.getElementById('cat-inline-submit').addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
  setTimeout(function(){ input.focus(); }, 50);
}
window.addCatInline = addCatInline;
window.addNote = addNote;

document.getElementById('tabs').addEventListener('wheel', function(e) {
  e.preventDefault();
  this.scrollLeft += e.deltaY || e.deltaX;
}, {passive: false});

window.handleOverlayClick = handleOverlayClick;
setSyncStatus('接続中…');
</script>
</body>
