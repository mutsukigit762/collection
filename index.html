    _lbApplyZoom(false);
    var decay = Math.pow(LB_FRICTION, dt / 16);
    _lbVx *= decay; _lbVy *= decay;
    if (Math.hypot(_lbVx, _lbVy) < 0.02) { _lbInertiaRAF = null; _lbVx = 0; _lbVy = 0; return; }
    _lbInertiaRAF = requestAnimationFrame(step);
  };
  _lbInertiaRAF = requestAnimationFrame(step);
  return true;
}

// 走っている滑りだけ止めて、速さは残す（滑りを始める時の後始末用）
function _lbStopInertia_keepSpeed() {
  if (_lbInertiaRAF) { cancelAnimationFrame(_lbInertiaRAF); _lbInertiaRAF = null; }
}

function _lbSettleZoom() {
  if (_lbScale <= 1.02) { _lbResetZoom(true); return; }
  if (_lbStartInertia()) return;   // 滑り出したら、位置合わせはそちらに任せる
  _lbClamp();
  _lbApplyZoom(true);
}

function _lbToggleZoomAt(cx, cy) {
  if (_lbScale > 1.02) _lbResetZoom(true);
  else { _lbZoomTo(2.5, cx, cy); _lbApplyZoom(true); }
}

function _lbMouseUp() { _lbMouseDown = false; }

function _lbTouchDist(t) {
  return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
}

function _lbStartPan(t) {
  _lbStopInertia();          // 滑っている途中で指を置いたら、そこで止める
  _lbPanning = true;
  _lbPanStartX = t.clientX; _lbPanStartY = t.clientY;
  _lbPanStartTx = _lbTx; _lbPanStartTy = _lbTy;
  _lbMoveT = 0; _lbMoveX = t.clientX; _lbMoveY = t.clientY;
}

// 画像の上を素早く2回叩いたら拡大／等倍を切り替える
function _lbTapCheck(e) {
  var t = e.changedTouches && e.changedTouches[0];
  if (!t || !e.target.closest || !e.target.closest('.lb-slide img')) return;
  var now = Date.now();
  if (now - _lbLastTapT < 300 && Math.abs(t.clientX - _lbLastTapX) < 30 && Math.abs(t.clientY - _lbLastTapY) < 30) {
    _lbLastTapT = 0;
    e.preventDefault();
    _lbToggleZoomAt(t.clientX, t.clientY);
  } else {
    _lbLastTapT = now; _lbLastTapX = t.clientX; _lbLastTapY = t.clientY;
  }
}

function _lbUpdateUI() {
  var counter = _lbBg.querySelector('.img-modal-counter');
  if (counter) counter.textContent = _lbUrls.length > 1 ? (_lbIdx + 1) + ' / ' + _lbUrls.length : '';
  var prev = _lbBg.querySelector('.img-modal-arrow.prev');
  var next = _lbBg.querySelector('.img-modal-arrow.next');
  if (prev) prev.disabled = _lbIdx === 0;
  if (next) next.disabled = _lbIdx === _lbUrls.length - 1;
}

function _lbGo(dir) {
  var newIdx = _lbIdx + dir;
  // これ以上めくれない時は、ちょっと押してから戻す（端まで来たのが指で分かるように）
  if (newIdx < 0 || newIdx >= _lbUrls.length) {
    clearTimeout(_lbBounceTimer);
    _lbSetPos(dir > 0 ? -28 : 28, true, 0.13);
    _lbBounceTimer = setTimeout(function(){ _lbSetPos(0, true, 0.22); }, 140);
    return;
  }
  _lbResetZoom(true);
  _lbIdx = newIdx;
  _lbSetPos(0, true);
  _lbUpdateUI();
}

function _lbClose() {
  clearTimeout(_lbBounceTimer);
  clearTimeout(_lbSuppressTimer);
  _lbStopInertia();
  if (_lbBg) { _lbBg.remove(); _lbBg = null; }
  _lbScale = 1; _lbTx = 0; _lbTy = 0;
  _lbPinching = false; _lbPanning = false; _lbDragging = false; _lbMouseDown = false;
  _lbMoved = false; _lbSuppressClick = false;
  document.body.style.overflow = '';
  document.removeEventListener('keydown', _lbKeyHandler);
  window.removeEventListener('mouseup', _lbMouseUp);
}

function _lbKeyHandler(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { _lbGo(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { _lbGo(1); }
  else if (e.key === 'Escape') { _lbClose(); }
}

function _lbOpen(urls, idx) {
  if (!urls || !urls.length) return;
  _lbUrls = urls;
  _lbIdx = idx || 0;

  var bg = document.createElement('div');
  bg.className = 'img-modal-bg';

  var trackHTML = '<div class="lb-track">';
  for (var i = 0; i < urls.length; i++) {
    trackHTML += '<div class="lb-slide"><img src="' + urls[i] + '"></div>';
  }
  trackHTML += '</div>';

  bg.innerHTML = '<div class="lb-safe-probe"></div>'
    + '<button class="img-modal-close" title="閉じる">×</button>'
    + (urls.length > 1 ? '<button class="img-modal-arrow prev">‹</button>' : '')
    + trackHTML
    + (urls.length > 1 ? '<button class="img-modal-arrow next">›</button>' : '')
    + '<div class="img-modal-counter"></div>';

  bg.querySelector('.img-modal-close').onclick = function(e){ e.stopPropagation(); _lbClose(); };
  bg.onclick = function(e){
    // 指を動かした直後の click は捨てる（動かしただけで閉じないように）
    if (_lbSuppressClick) { _lbSuppressClick = false; clearTimeout(_lbSuppressTimer); return; }
    if (!e.target.closest('.lb-slide img, .img-modal-close, .img-modal-arrow, .img-modal-counter')) _lbClose();
  };

  var prev = bg.querySelector('.img-modal-arrow.prev');
  var next = bg.querySelector('.img-modal-arrow.next');
  if (prev) prev.onclick = function(e){ e.stopPropagation(); _lbGo(-1); };
  if (next) next.onclick = function(e){ e.stopPropagation(); _lbGo(1); };

  bg.addEventListener('touchstart', function(e){
    clearTimeout(_lbBounceTimer);
    _lbStopInertia();
    if (e.touches.length === 1) _lbMoved = false;
    // 指2本＝つまんで拡大。ページ送りの方は止める
    if (e.touches.length >= 2) {
      _lbDragging = false; _lbPanning = false; _lbAxis = 0;
      _lbPinching = true;
      _lbPinchStartDist = _lbTouchDist(e.touches);
      _lbPinchStartScale = _lbScale;
      _lbPinchLastCx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      _lbPinchLastCy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      return;
    }
    // 拡大中の指1本は、ページ送りではなく画像を動かす操作
    if (_lbScale > 1.02) { _lbStartPan(e.touches[0]); return; }
    _lbTouchStartX = e.touches[0].clientX;
    _lbTouchStartY = e.touches[0].clientY;
    _lbTouchDx = 0;
    _lbAxis = 0;
    _lbDragging = true;
    var track = _lbTrack();
    if (track) track.style.transition = 'none';
  }, { passive: false });

  bg.addEventListener('touchmove', function(e){
    if (_lbPinching && e.touches.length >= 2) {
      e.preventDefault();
      var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      // 2本指ごと平行に動かした分は、そのまま画像を動かす
      _lbTx += cx - _lbPinchLastCx;
      _lbTy += cy - _lbPinchLastCy;
      _lbPinchLastCx = cx; _lbPinchLastCy = cy;
      _lbMarkMoved();
      var d = _lbTouchDist(e.touches);
      if (_lbPinchStartDist > 0) _lbZoomTo(_lbPinchStartScale * d / _lbPinchStartDist, cx, cy);
      _lbApplyZoom(false);
      return;
    }
    if (_lbPanning) {
      e.preventDefault();
      var pdx = e.touches[0].clientX - _lbPanStartX;
      var pdy = e.touches[0].clientY - _lbPanStartY;
      if (Math.abs(pdx) > 6 || Math.abs(pdy) > 6) _lbMarkMoved();
      _lbTrackSpeed(e.touches[0].clientX, e.touches[0].clientY);
      _lbTx = _lbPanStartTx + pdx;
      _lbTy = _lbPanStartTy + pdy;
      _lbClamp();
      _lbApplyZoom(false);
      return;
    }
    if (!_lbDragging) return;
    var dx = e.touches[0].clientX - _lbTouchStartX;
    var dy = e.touches[0].clientY - _lbTouchStartY;
    // 10px 動いた時点で縦か横かを決める。縦と決まったら以降は何もしない
    if (_lbAxis === 0) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      _lbAxis = Math.abs(dx) > Math.abs(dy) ? 1 : 2;
      // 縦でも横でも「動かした」扱い。ここを漏らすと縦に払った後に閉じてしまう
      _lbMarkMoved();
    }
    if (_lbAxis !== 1) return;
    e.preventDefault();
    _lbTouchDx = dx;
    var atStart = _lbIdx === 0 && _lbTouchDx > 0;
    var atEnd = _lbIdx === _lbUrls.length - 1 && _lbTouchDx < 0;
    var resistance = (atStart || atEnd) ? 0.2 : 1;
    _lbSetPos(_lbTouchDx * resistance, false);
  }, { passive: false });

  bg.addEventListener('touchend', function(e){
    // 動かして離した時は、ブラウザが後から出してくる click 自体を出させない
    if (_lbMoved && e.cancelable && e.touches.length === 0) e.preventDefault();
    if (_lbPinching) {
      // 指が1本だけ残ったら、そのまま画像を動かす操作に引き継ぐ
      if (e.touches.length >= 1) { _lbPinching = false; _lbStartPan(e.touches[0]); return; }
      _lbPinching = false;
      _lbSettleZoom();
      return;
    }
    if (_lbPanning) {
      if (e.touches.length >= 1) return;
      _lbPanning = false;
      _lbSettleZoom();
      _lbTapCheck(e);
      return;
    }
    if (!_lbDragging) { _lbTapCheck(e); return; }
    _lbDragging = false;
    if (_lbAxis !== 1) { _lbTapCheck(e); return; }
    var threshold = window.innerWidth * 0.15;
    if (_lbTouchDx < -threshold) {
      _lbGo(1);
    } else if (_lbTouchDx > threshold) {
      _lbGo(-1);
    } else {
      _lbSetPos(0, true);
    }
  }, { passive: false });

  // パソコン用：ダブルクリックで拡大、ホイールで倍率、拡大中はドラッグで動かす
  bg.addEventListener('dblclick', function(e){
    if (!e.target.closest('.lb-slide img')) return;
    e.preventDefault();
    _lbToggleZoomAt(e.clientX, e.clientY);
  });

  bg.addEventListener('wheel', function(e){
    if (!e.target.closest('.lb-slide img') && _lbScale <= 1.02) return;
    e.preventDefault();
    _lbStopInertia();
    _lbZoomTo(_lbScale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
    _lbApplyZoom(false);
    if (_lbScale <= 1.02) _lbResetZoom(false);
  }, { passive: false });

  bg.addEventListener('mousedown', function(e){
    if (_lbScale <= 1.02 || !e.target.closest('.lb-slide img')) return;
    e.preventDefault();
    _lbStopInertia();
    _lbMouseDown = true;
    _lbPanStartX = e.clientX; _lbPanStartY = e.clientY;
    _lbPanStartTx = _lbTx; _lbPanStartTy = _lbTy;
  });

  bg.addEventListener('mousemove', function(e){
    if (!_lbMouseDown) return;
    if (Math.abs(e.clientX - _lbPanStartX) > 4 || Math.abs(e.clientY - _lbPanStartY) > 4) _lbMarkMoved();
    _lbTx = _lbPanStartTx + (e.clientX - _lbPanStartX);
    _lbTy = _lbPanStartTy + (e.clientY - _lbPanStartY);
    _lbClamp();
    _lbApplyZoom(false);
  });

  window.addEventListener('mouseup', _lbMouseUp);

  _lbBg = bg;
  clearTimeout(_lbSuppressTimer);
  _lbScale = 1; _lbTx = 0; _lbTy = 0;
  _lbPinching = false; _lbPanning = false; _lbDragging = false; _lbMouseDown = false;
  _lbMoved = false; _lbSuppressClick = false;
  document.body.style.overflow = 'hidden';
  document.body.appendChild(bg);
  _lbSetPos(0, false);
  _lbUpdateUI();
  document.addEventListener('keydown', _lbKeyHandler);
}

function renderTabs() {
  var t = document.getElementById('tabs');
  var tabs = allTabs();
  t.innerHTML = tabs.map(function(c) {
    var cls = 'tab';
    var isActive = false;
    if (searchQuery) {
      if (_searchMatchedCats.indexOf(c) >= 0) cls += ' tab-match';
    } else if (c === currentCat) {
      cls += ' active';
      isActive = true;
    }
    var clearBtn = (isActive && c !== ALL_TAB)
      ? '<span class="tab-clear" onclick="event.stopPropagation();switchCat(\'' + ALL_TAB + '\')">' + IC.x + '</span>'
      : '';
    return '<button class="' + cls + '" onclick="switchCat(\'' + esc(c) + '\')">' + esc(c) + clearBtn + '</button>';
  }).join('') + '<button class="tab-add" onclick="addCatInline()">' + IC.plus + '</button>';
  if (searchQuery && _searchMatchedCats.length) {
    var firstMatch = t.querySelector('.tab-match');
    if (firstMatch) firstMatch.scrollIntoView({ inline: 'center', block: 'nearest' });
  } else if (!searchQuery && _scrollTabIntoView) {
    var activeTab = t.querySelector('.tab.active');
    if (activeTab) activeTab.scrollIntoView({ inline: 'center', block: 'nearest' });
    _scrollTabIntoView = false;
  }
}

function _isDesktop() {
  return window.matchMedia('(min-width:900px)').matches;
}

var selectedCardId = null;
var _mountedDetailId = null;

function catFilterNote(n) {
  if (currentCat === ALL_TAB) return true;
  if (currentCat === NO_CAT) return !n.cat || n.cat === NO_CAT || n.cat === '';
  return n.cat === currentCat;
}

function catChipHTML(n) {
  var cat = n.cat || NO_CAT;
  return '<span class="pv-cat" style="' + esc(catChipStyle(n.cat)) + '" onclick="event.stopPropagation();switchCat(\''
    + esc(cat) + '\')">' + esc(cat) + '</span>';
}

function cardPreviewHTML(n) {
  var plain = htmlToPlainText(n.body || '').trim();
  var m = (n.body || '').match(/<img[^>]+src="([^"]+)"/);
  var thumb = m ? '<img class="pv-thumb" src="' + esc(m[1]) + '" loading="lazy">' : '';
  // 表が入っているメモは、本文を字にすると行がつながって見分けが付かないので目印を出す
  var tableMark = /<table[\s>]/i.test(n.body || '')
    ? '<span class="pv-table-mark" title="表が入っている" aria-label="表が入っている">' + IC.table + '</span>' : '';
  var snippet = plain ? escAndHighlight(plain.slice(0, 300), searchQuery)
    : (m ? '<span class="pv-muted">（画像）</span>'
         : (tableMark ? '<span class="pv-muted">（表）</span>' : '<span class="pv-muted">（空）</span>'));
  var sel = n.id === selectedCardId ? ' pv-selected' : '';
  return '<div class="pv-row-wrap">'
    + '<button class="pv-delete-btn" onclick="event.stopPropagation();deleteNote(\'' + n.id + '\')" aria-label="削除">' + IC.trash + '</button>'
    + '<div class="pv-item' + sel + '" data-id="' + n.id + '" onclick="onCardClick(\'' + n.id + '\')">'
    + '<div class="pv-meta">' + catChipHTML(n) + tableMark
    + '<span class="pv-meta-right"><span class="pv-date' + (_dateIsUnrecovered(n) ? ' date-unrecovered' : '') + '" data-date-id="' + n.id + '">' + dateSpanInnerHTML(n) + '</span>'
    + '<button class="pv-trash-pc" onclick="event.stopPropagation();deleteNote(\'' + n.id + '\')" title="ゴミ箱へ" aria-label="削除">' + IC.trash + '</button></span></div>'
    + '<div class="pv-row">' + thumb + '<div class="pv-text">' + snippet + '</div></div>'
    + '</div>'
    + '</div>';
}

function detailCardHTML(n) {
  return '<div class="card" id="card-' + n.id + '">'
    + '<div class="card-top" onclick="_detailThemeTap(event)">'
    + '<button class="cat-btn" style="' + esc(catChipStyle(n.cat)) + '" onclick="openCatModal(\'' + n.id + '\')">' + esc(n.cat || NO_CAT) + '</button>'
    + '<span style="display:inline-flex;align-items:center;gap:2px">'
    + '<button class="btn-icon" onclick="resetUpdatedAt(\'' + n.id + '\')" title="更新日時をリセット（作成日時に戻す）" aria-label="更新日時をリセット">' + IC.restore + '</button>'
    + '<button class="fav-btn' + (n.fav ? ' on' : '') + '" data-fav-id="' + n.id + '" onclick="toggleFav(\'' + n.id + '\')" title="' + (n.fav ? 'お気に入りを外す' : 'お気に入りに追加') + '" aria-label="お気に入り">' + IC.heart + '</button>'
    + '<button class="btn-icon" onclick="deleteNote(\'' + n.id + '\')" title="ゴミ箱へ">' + IC.trash + '</button>'
    + '</span>'
    + '</div>'
    + makeToolbar(n.id) + '<div class="card-editor" id="editor-' + n.id + '"></div>'
    + '<div class="card-footer"><span class="card-date' + (_dateIsUnrecovered(n) ? ' date-unrecovered' : '') + '" data-date-id="' + n.id + '">' + dateSpanInnerHTML(n) + '</span>' + byteCountHTML(n.body || '') + '</div>'
    + '</div>';
}

function _updatePreviewSelection() {
  document.querySelectorAll('#cards .pv-item').forEach(function(it) {
    it.classList.toggle('pv-selected', it.getAttribute('data-id') === selectedCardId);
  });
}

function renderDetail() {
  var pane = document.getElementById('detail-pane');
  if (!pane) return;
  var n = notes.find(function(x){ return x.id === selectedCardId; });
  if (!n) n = notes.filter(catFilterNote)[0];
  if (!n) { pane.innerHTML = ''; _mountedDetailId = null; return; }
  selectedCardId = n.id;
  // すでに同じカードのエディタが載っていれば載せ直さない（編集中フォーカスを保つ）
  if (_mountedDetailId === n.id && editors[n.id] && document.getElementById('editor-' + n.id)) {
    _updatePreviewSelection();
    return;
  }
  if (_mountedDetailId && _mountedDetailId !== n.id) destroyEditor(_mountedDetailId);
  pane.innerHTML = '<div class="detail-mobile-bar"><button class="detail-back-btn" onclick="closeMobileDetail()">' + IC.arrowLeft + '一覧へ戻る</button></div>' + detailCardHTML(n);
  initEditor(n.id, n.body);
  _mountedDetailId = n.id;
  _updatePreviewSelection();
}

// 編集中のカードの一覧プレビュー（サムネイル・抜粋）を最新の内容で作り直す。
// 「編集の確定」は他のカードにフォーカスを移した瞬間とみなす。
function _refreshPreviewCard(id) {
  if (!id) return;
  var n = notes.find(function(x){ return x.id === id; });
  if (!n) return;
  var item = document.querySelector('#cards .pv-item[data-id="' + id + '"]');
  var wrap = item && item.closest('.pv-row-wrap');
  if (wrap) wrap.outerHTML = cardPreviewHTML(n);
}

var _listScrollY = 0;
// 一覧内でのフォーカス移動のみ（モバイルでは詳細画面へは遷移しない）
function focusCard(id) {
  if (selectedCardId === id) return;
  var prevId = selectedCardId;
  selectedCardId = id;
  if (prevId && prevId !== id) _refreshPreviewCard(prevId);
  renderDetail();
  var pane = document.getElementById('detail-pane');
  if (pane) pane.scrollTop = 0;
}
window.focusCard = focusCard;

// フォーカス＋詳細を開く（デスクトップは常にこれ、モバイルは選択済みカードの2回目タップ/Enterで呼ぶ）
function openCard(id) {
  // 詳細を開く直前に一覧のスクロール位置を覚えておく（戻った時に復元する）
  if (!_isDesktop() && !document.body.classList.contains('mobile-detail-open')) {
    _listScrollY = window.scrollY;
  }
  focusCard(id);
  if (!_isDesktop()) document.body.classList.add('mobile-detail-open');
}
window.openCard = openCard;

// カードクリック時の分岐：デスクトップは即座に詳細を開く。
// モバイルは1回目のタップでフォーカスのみ、フォーカス済みカードへの2回目のタップで詳細を開く。
function onCardClick(id) {
  openCard(id);
}
window.onCardClick = onCardClick;

function selectCard(id) { openCard(id); }
window.selectCard = selectCard;

// 本文を打ち始めた／打ち終えたを見て、下の余白の広さを切り替える。
// 読んでいるだけの時に余白が広いと、最後の行が画面の上まで行きすぎる
function _detailEditing(on) {
  document.body.classList.toggle('detail-editing', !!on);
}
document.addEventListener('focusin', function(e) {
  if (e.target.closest && e.target.closest('.detail-pane .ProseMirror')) _detailEditing(true);
});
document.addEventListener('focusout', function(e) {
  if (!(e.target.closest && e.target.closest('.detail-pane .ProseMirror'))) return;
  // 次にどこへ移るかが決まってから見る（本文の中で移っただけなら、そのまま）
  setTimeout(function() {
    var a = document.activeElement;
    if (!a || !a.closest || !a.closest('.detail-pane .ProseMirror')) _detailEditing(false);
  }, 0);
});

function closeMobileDetail() {
  var wasOpen = document.body.classList.contains('mobile-detail-open');
  document.body.classList.remove('mobile-detail-open');
  _detailEditing(false);
  if (wasOpen) _refreshPreviewCard(selectedCardId);
  // 一覧が再表示されたらスクロール位置を戻す（描画確定後に）
  if (wasOpen && !_isDesktop()) {
    var y = _listScrollY;
    window.scrollTo(0, y);
    requestAnimationFrame(function(){ window.scrollTo(0, y); });
  }
}
window.closeMobileDetail = closeMobileDetail;

// 詳細画面の指の動き。縦と横で役目が違う。
//   下へ引く（一番上まで来ている時だけ）… 一覧へ戻る
//   横へ払う                        … 前後のメモへ移る
// 向きは、指が DS_DECIDE だけ動いたところで一度だけ見分けて、あとは固定する。
// まっすぐ横・まっすぐ縦とみなせない斜めの動きは、どちらの操作でもないので捨てる
var DS_PULL = 70;    // 下へこれだけ引いたら一覧へ戻る
var DS_SWIPE = 60;   // 横へこれだけ払ったら隣のメモへ
var DS_DECIDE = 20;  // これだけ動いたところで、縦か横か斜めかを見分ける
var DS_SLANT = 2;    // 長い方が短い方のこの倍数に届かなければ「斜め」。2 なら約27度までがまっすぐ
var _dsStartX = null, _dsStartY = null, _dsTracking = false, _dsFromTop = false;
var _dsDir = null;   // この指の動きの向き。null=まだ見分けていない, 'x'=横, 'y'=縦
function _dsHasActiveSelection() {
  var sel = window.getSelection ? window.getSelection() : null;
  return !!(sel && !sel.isCollapsed && sel.toString().length > 0);
}
function _dsAtTop() {
  var pane = document.getElementById('detail-pane');
  return !!pane && pane.scrollTop <= 0;
}
// 隣のメモへ移る時、画面を横に流す。今のページを払った向きへ送り出しながら、
// 次のページを反対側から入れる。2枚が同時に動いて見えるよう、出ていく側は
// 今の見た目を写し取った置き物（.ds-ghost）に任せ、本体には次のメモを載せる
var DS_SLIDE_MS = 220;   // 流れきるまでの長さ。開け閉め（0.22s）と揃えてある
var _dsSliding = false;
// 末尾に着いた時、それが本当の終わりとは限らない。一覧がまだ30件しか
// 読み込んでいないだけのことがあるので、続きを頼んで、届いてから隣へ送る。
// 待っている間は _dsSliding を立てて、指を何度も受けないようにしておく
function _dsSlideWhenLoaded(dir) {
  if (dir < 0 || !_jkCanLoadMore()) return;   // 前へ戻る側と、本当にもう無い時は行き止まり
  _dsSliding = true;
  document.body.classList.add('ds-swiping');
  Promise.resolve(loadNotes(false)).then(function() {
    _dsSliding = false;
    if (_jkPeekId(dir)) { _dsSlideTo(dir); return; }
    document.body.classList.remove('ds-swiping');
  });
}

// 今、流す動きを見せられるか（流れている最中・詳細画面が開いていない・
// 動きを減らす設定、のいずれでもないか）
function _dsCanSlide() {
  if (_dsSliding) return false;
  if (!document.getElementById('detail-pane')) return false;
  if (_isDesktop() || !document.body.classList.contains('mobile-detail-open')) return false;
  return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// 出ていく側：今の見た目をそのまま写す。id と編集可能の印は、
// 本体と二重になって取り違えのもとになるので剥がしておく。
// 中身を差し替える前に呼ぶこと（後だと新しい中身を写してしまう）
function _dsMakeGhost() {
  var pane = document.getElementById('detail-pane');
  if (!pane) return null;
  var ghost = document.createElement('div');
  ghost.className = pane.className + ' ds-ghost';
  ghost.innerHTML = pane.innerHTML;
  ghost.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
  ghost.querySelectorAll('[contenteditable]').forEach(function(n){ n.removeAttribute('contenteditable'); });
  ghost.style.transition = 'none';
  ghost.style.transform = 'translateX(0)';
  document.body.appendChild(ghost);
  ghost.scrollTop = pane.scrollTop;   // 読んでいた高さのまま出ていくように
  return ghost;
}

// 差し替え済みの本体と、出ていく写しを、左右に流す。
// dir>0 なら本体は右から入ってきて、写しは左へ抜ける
function _dsRunSlide(ghost, dir) {
  var pane = document.getElementById('detail-pane');
  if (!pane || !ghost) {
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    _dsSliding = false;
    return;
  }
  document.body.classList.add('ds-swiping');   // 流れている間はスクロールバーを出さない
  var from = dir > 0 ? 1 : -1;
  pane.style.transition = 'none';
  pane.style.transform = 'translateX(' + (from * 100) + '%)';
  void pane.offsetWidth;              // ここまでの置き位置を一度描かせてから動かす

  // 2枚を同時に動かす
  pane.style.transition = 'transform ' + DS_SLIDE_MS + 'ms ease';
  ghost.style.transition = 'transform ' + DS_SLIDE_MS + 'ms ease';
  pane.style.transform = 'translateX(0)';
  ghost.style.transform = 'translateX(' + (-from * 100) + '%)';

  setTimeout(function() {
    if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
    pane.style.transition = '';       // 開け閉めの動き（CSS側）に戻す
    pane.style.transform = '';
    _dsSliding = false;
    document.body.classList.remove('ds-swiping');  // 流れきったので、バーをまた出す
  }, DS_SLIDE_MS + 20);
}

function _dsSlideTo(dir) {
  if (_dsSliding) return;
  // 端。ただし「次へ」の側は、続きが未読み込みなだけかもしれないので確かめる
  if (!_jkPeekId(dir)) { _dsSlideWhenLoaded(dir); return; }
  var pane = document.getElementById('detail-pane');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!pane || reduce) { _jkMove(dir); return; }  // 動きを減らす設定の時は、流さずに差し替える
  _dsSliding = true;
  var ghost = _dsMakeGhost();
  // 本体を隣のメモに差し替えて、まだ画面の外（入ってくる側）へ置いておく。
  // 左へ払った（dir=1）なら次のメモは右から、右へ払ったなら左から入る
  _jkMove(dir);
  _dsRunSlide(ghost, dir);
}

document.addEventListener('touchstart', function(e) {
  if (_isDesktop() || !document.body.classList.contains('mobile-detail-open')) return;
  // 画像を大きく出している間は、その上での指の動きを詳細画面が横取りしない。
  // 拾ってしまうと、画像を動かしただけで一覧に戻ったり隣のメモへ移ったりする
  if (_lbBg) return;
  if (_dsSliding) return;              // 流れている最中は次の指を受けない
  if (e.touches.length !== 1) return;
  if (_dsHasActiveSelection()) return; // 文字選択のハンドル操作とバッティングしないよう除外
  _dsStartX = e.touches[0].clientX;
  _dsStartY = e.touches[0].clientY;
  _dsFromTop = _dsAtTop();             // 戻る判定は、一番上から引き始めた時だけ認める
  _dsDir = null;
  _dsLockV = false;
  _dsTracking = true;
}, { passive: true });

// 横に払うと決まったら、そこから指を離すまで縦のスクロールを渡さない。
// 渡したままだと、払っている間に本文が上下にもズレて気持ち悪い。
// そのためにはブラウザに「この指の動きは自分が引き取る」と言える形で
// 見張る必要がある（passive:false）。ただしこれはページ全体に付けると
// スクロール全部が重くなるので、詳細画面の中だけに絞ってある
var _dsLockV = false;
var _dsPane = document.getElementById('detail-pane');
if (_dsPane) _dsPane.addEventListener('touchmove', function(e) {
  // 横と決まった後。隣へ流れ始めた後もこのまま押さえ続ける
  if (_dsLockV) { if (e.cancelable) e.preventDefault(); return; }
  if (!_dsTracking || _dsDir) return;
  if (_dsHasActiveSelection()) return;
  var dx = e.touches[0].clientX - _dsStartX;
  var dy = e.touches[0].clientY - _dsStartY;
  var ax = Math.abs(dx), ay = Math.abs(dy);
  // 下の見張りと同じ物差しで、横かどうかだけを一足先に見る。
  // ここで押さえておかないと、向きが決まったフレームの縦ズレが残る
  if (ax < DS_DECIDE && ay < DS_DECIDE) return;
  if (ax > ay * DS_SLANT) {
    _dsLockV = true;
    if (e.cancelable) e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  if (_lbBg) { _dsTracking = false; return; }   // 画像を大きく出している間は何もしない
  if (!_dsTracking) return;
  if (_dsHasActiveSelection()) { _dsTracking = false; return; } // 選択ハンドルのドラッグ中は判定しない
  var dx = e.touches[0].clientX - _dsStartX;
  var dy = e.touches[0].clientY - _dsStartY;
  var ax = Math.abs(dx), ay = Math.abs(dy);
  if (!_dsDir) {
    // まだ動きが小さいうちは、どちらの向きか決めない（少しの震えで決めつけないため）
    if (ax < DS_DECIDE && ay < DS_DECIDE) return;
    if (ax > ay * DS_SLANT) _dsDir = 'x';
    else if (ay > ax * DS_SLANT) _dsDir = 'y';
    else { _dsTracking = false; return; }  // 斜め。横でも縦でもないので、この動きは捨てる
    // 横と決まったら、この指が離れて流れきるまでスクロールバーを出さない
    if (_dsDir === 'x') document.body.classList.add('ds-swiping');
  }
  if (_dsDir === 'x') {
    // 横へ払った：一覧に並んでいる順で、隣のメモへ移る。
    // 左へ払うと次（一覧で下にあるメモ）、右へ払うと前（上にあるメモ）
    if (ax > DS_SWIPE) { _dsTracking = false; _dsSlideTo(dx < 0 ? 1 : -1); }
    return;
  }
  // 縦へ動いた：一番上から下へ引いた時だけ戻る。
  // 読んでいる途中や、指を上へ動かしてスクロールした時は何もしない
  if (!_dsFromTop || !_dsAtTop()) { _dsTracking = false; return; }
  if (dy > DS_PULL) { _dsTracking = false; closeMobileDetail(); }
}, { passive: true });
function _dsEnd() {
  _dsTracking = false;
  _dsDir = null;
  _dsLockV = false;      // 指が離れたので、縦のスクロールをブラウザに返す
  // 払ったのに隣が無かった時など、流れが始まっていなければここで元に戻す。
  // 流れている最中は、終わりの後片付け（_dsSlideTo）に任せる
  if (!_dsSliding) document.body.classList.remove('ds-swiping');
}
document.addEventListener('touchend', _dsEnd, { passive: true });
// 指がOSの操作に横取りされて touchend が来ない時があるので、こちらでも後片付けする
// （でないとバーが消えたまま戻らない）
document.addEventListener('touchcancel', _dsEnd, { passive: true });

// 一覧のカード：左スワイプで削除ボタンを出す
var PV_DELETE_W = 76;
var _pvOpenId = null;
var _pvSwipe = { id: null, startX: 0, startY: 0, baseOffset: 0, lastOffset: 0, active: false, moved: false };
var _pvSuppressClick = false;

function _pvSetOffset(id, offset, animate) {
  var el = document.querySelector('#cards .pv-item[data-id="' + id + '"]');
  if (!el) return;
  el.style.transition = animate ? 'transform 0.18s ease' : 'none';
  el.style.transform = offset ? 'translateX(' + offset + 'px)' : '';
  // スワイプ量に合わせてゴミ箱アイコンを「無」から出現させて拡大する
  var icon = el.parentNode && el.parentNode.querySelector('.pv-delete-btn svg');
  if (icon) {
    var p = Math.min(1, Math.abs(offset) / PV_DELETE_W);
    icon.style.transition = animate ? 'transform 0.18s ease, opacity 0.18s ease' : 'none';
    icon.style.opacity = p;
    icon.style.transform = 'scale(' + (0.3 + 0.7 * p) + ')';
  }
}
function _pvCloseOpen() {
  if (_pvOpenId) { _pvSetOffset(_pvOpenId, 0, true); _pvOpenId = null; }
}

document.addEventListener('touchstart', function(e) {
  if (_isDesktop()) return;
  var item = e.target.closest && e.target.closest('#cards .pv-item');
  if (!item || e.touches.length !== 1) {
    if (!(e.target.closest && e.target.closest('.pv-row-wrap'))) _pvCloseOpen();
    return;
  }
  var id = item.getAttribute('data-id');
  if (_pvOpenId && _pvOpenId !== id) _pvCloseOpen();
  _pvSwipe.id = id;
  _pvSwipe.startX = e.touches[0].clientX;
  _pvSwipe.startY = e.touches[0].clientY;
  _pvSwipe.baseOffset = (_pvOpenId === id) ? -PV_DELETE_W : 0;
  _pvSwipe.lastOffset = _pvSwipe.baseOffset;
  _pvSwipe.active = true;
  _pvSwipe.moved = false;
}, { passive: true });

document.addEventListener('touchmove', function(e) {
  if (!_pvSwipe.active) return;
  var dx = e.touches[0].clientX - _pvSwipe.startX;
  var dy = e.touches[0].clientY - _pvSwipe.startY;
  if (!_pvSwipe.moved) {
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;      // 判定するにはまだ小さい
    if (Math.abs(dy) > Math.abs(dx)) { _pvSwipe.active = false; return; } // 縦優位なら通常スクロールに任せる
    _pvSwipe.moved = true;                                  // 横スワイプ確定
  }
  e.preventDefault();  // 横スワイプ中は縦スクロールをロック
  var next = _pvSwipe.baseOffset + dx;
  if (next > 0) next = 0;
  if (next < -PV_DELETE_W) next = -PV_DELETE_W + (next + PV_DELETE_W) * 0.25;
  _pvSwipe.lastOffset = next;
  _pvSetOffset(_pvSwipe.id, next, false);
}, { passive: false });

document.addEventListener('touchend', function() {
  if (!_pvSwipe.active) return;
  _pvSwipe.active = false;
  var wasOpen = _pvSwipe.baseOffset === -PV_DELETE_W;
  if (!_pvSwipe.moved) {
    // ちょい動きなしのタップ：開いていた行なら閉じるだけにして詳細を開かせない
    if (wasOpen) { _pvSuppressClick = true; _pvCloseOpen(); }
    return;
  }
  _pvSuppressClick = true;
  if (_pvSwipe.lastOffset < -PV_DELETE_W / 2) {
    _pvSetOffset(_pvSwipe.id, -PV_DELETE_W, true);
    _pvOpenId = _pvSwipe.id;
  } else {
    _pvSetOffset(_pvSwipe.id, 0, true);
    if (_pvOpenId === _pvSwipe.id) _pvOpenId = null;
  }
}, { passive: true });

// ゴミ箱を出したあと、縦スクロールしたら自動で隠す
window.addEventListener('scroll', function() {
  if (_pvOpenId) _pvCloseOpen();
}, { passive: true });

// 一覧を一番上から下に引っ張って更新（Safariの引っ張りリロードと同じ動き）。
// 上の2つのスワイプは横方向専用なので、縦優位のこの操作とはぶつからない。
var PTR_TRIGGER = 64;   // これ以上引いたら更新する
var PTR_MAX = 104;      // 引っ張れる上限
var _ptrEl = document.getElementById('ptr');
var _ptr = { startX: 0, startY: 0, active: false, pulling: false, dist: 0, busy: false };

// 引っ張りに合わせて動かす、ページの中身そのもの
var _ptrPage = document.getElementById('left-col');

// 見出しは地の色を持たず後ろの地がそのまま透けるので、引っ張って動かしても
// 絵柄がズレない。以前あった、動いたぶん模様を送り返す処理はもう要らない。

function _ptrDraw(dist) {
  _ptrEl.classList.remove('ease');
  _ptrPage.classList.remove('ease');
  // ページの中身を丸ごと下げて、空いた隙間にスピナーを置く
  _ptrPage.style.transform = 'translateY(' + dist + 'px)';
  _ptrEl.style.opacity = Math.min(1, dist / PTR_TRIGGER);
  _ptrEl.style.transform = 'translateY(' + (dist / 2 - 8) + 'px)';
  // 引いた量に合わせてスピナーも1コマずつ回す（離す前から反応している感じを出す）
  _ptrEl.firstElementChild.style.transform = 'rotate(' + (Math.round(dist * 4 / 45) * 45) + 'deg)';
}
function _ptrReset() {
  _ptrEl.classList.add('ease');
  _ptrEl.classList.remove('spin');
  _ptrEl.style.opacity = '0';
  _ptrEl.style.transform = 'translateY(-30px)';
  _ptrEl.firstElementChild.style.transform = '';
  _ptrPage.classList.add('ease');
  _ptrPage.style.transform = '';
}
function _ptrCanStart() {
  return !_isDesktop()
    && !_ptr.busy
    && !document.body.classList.contains('mobile-detail-open')
    && !_anyModalOpen()
    && !_jkIsTyping()          // 検索の入力中に誤爆させない
    && window.scrollY <= 0;
}

document.addEventListener('touchstart', function(e) {
  if (e.touches.length !== 1 || !_ptrCanStart()) { _ptr.active = false; return; }
  _ptr.startX = e.touches[0].clientX;
  _ptr.startY = e.touches[0].clientY;
  _ptr.active = true;
  _ptr.pulling = false;
  _ptr.dist = 0;
}, { passive: true });

document.addEventListener('touchmove', function(e) {
  if (!_ptr.active) return;
  var dy = e.touches[0].clientY - _ptr.startY;
  var dx = e.touches[0].clientX - _ptr.startX;
  if (!_ptr.pulling) {
    if (dy < 8) { if (dy < -4) _ptr.active = false; return; }   // まだ判定できない／上向きなら降りる
    if (Math.abs(dx) > Math.abs(dy)) { _ptr.active = false; return; } // 横優位はカードのスワイプに任せる
    if (window.scrollY > 0) { _ptr.active = false; return; }
    _ptr.pulling = true;
  }
  e.preventDefault();   // 引っ張っている間はページ側のスクロール（ゴムのような動き）を止める
  _ptr.dist = Math.min(dy * 0.5, PTR_MAX);
  _ptrDraw(_ptr.dist);
}, { passive: false });

document.addEventListener('touchend', function() {
  if (!_ptr.active) return;
  var pulled = _ptr.pulling, dist = _ptr.dist;
  _ptr.active = false;
  _ptr.pulling = false;
  if (!pulled) return;
  if (dist < PTR_TRIGGER) { _ptrReset(); return; }
  // 十分引いた：スピナーを回したままアプリごと読み込み直す。
  // ページの中身はしきい値の位置まで戻して、その状態で読み込みを待たせる
  _ptr.busy = true;
  _ptrEl.classList.add('ease');
  _ptrEl.style.opacity = '1';
  _ptrEl.style.transform = 'translateY(' + (PTR_TRIGGER / 2 - 8) + 'px)';
  _ptrEl.firstElementChild.style.transform = '';
  _ptrEl.classList.add('spin');
  _ptrPage.classList.add('ease');
  _ptrPage.style.transform = 'translateY(' + PTR_TRIGGER + 'px)';
  location.reload();
}, { passive: true });

document.addEventListener('click', function(e) {
  if (!_pvSuppressClick) return;
  _pvSuppressClick = false;
  if (e.target.closest && e.target.closest('#cards .pv-item')) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

function renderCardsDesktop() {

var _filterCountKey = null;
async function updateFilterCount() {
  var countEl = document.getElementById('search-count');
  if (searchQuery) { _filterCountKey = null; return; }
  if (favOnly) {
    // ♥フィルタ中は全件読み込み済みなので数えるだけでいい。
    // お気に入りを外した直後も正しい件数になるよう、キャッシュは使わず毎回数え直す
    _filterCountKey = null;
    countEl.textContent = notes.filter(catFilterNote).length + '件';
    return;
  }
  var key = [currentCat, filterYear, filterMonth, filterDay, filterDir].join('|');
  if (key === _filterCountKey) return;
  _filterCountKey = key;
  try {
    var constraints = [where('deleted', '==', false)];
    if (currentCat !== ALL_TAB) constraints.push(where('cat', '==', currentCat));
    if (filterYear && filterDir) {
      var m = filterMonth ? filterMonth : (filterDir === 'before' ? '12' : '01');
      var d = filterDay ? filterDay : (filterDir === 'before' ? '31' : '01');
      var dateStr = filterYear + '-' + m + '-' + d;
      constraints.push(where('date', filterDir === 'before' ? '<=' : '>=', dateStr));
    }
    var snap = await getCountFromServer(query(collection(db, NOTES_COLL), ...constraints));
    if (searchQuery || key !== _filterCountKey) return;
    countEl.textContent = snap.data().count + '件';
  } catch(e) { console.error(e); _filterCountKey = null; }
}

function switchCat(c) {

}
var _searchTimer = null;
function onSearch(val) {

function initFilterSelects() {

// 本文の下に広く空けた余白を押したら、文章の末尾から書き始められるようにする。
// 押された場所が「余白そのもの」の時だけ反応させる（間にボタンや本文を挟んでいたら何もしない）ので、
// ♥やゴミ箱、カテゴリ、日時、本文中のリンクの邪魔をしない。
document.getElementById('detail-pane').addEventListener('click', function(e) {
  if (e.target !== this && !e.target.classList.contains('card')) return;
  if (!editors[selectedCardId]) return;
  var pane = this;
  var keep = pane.scrollTop;              // 今見ている位置を覚えておく
  _focusSelectedEditor(false);            // 押した流れの中で呼ぶのでキーボードも出る
  // iOSのSafariはキーボードを出す時に、フォーカスした部品を見せようとして
  // 画面を勝手に動かす。読んでいた場所から飛ばされるので、少しの間押さえ込む
  var hold = function() { if (pane.scrollTop !== keep) pane.scrollTop = keep; };
  hold();
  requestAnimationFrame(hold);
  var t = 0, iv = setInterval(function() { hold(); if (++t > 20) clearInterval(iv); }, 25);
  setTimeout(function() { clearInterval(iv); }, 600);
});

// 一覧を下スクロール（指を上へ）すると見出しが隠れ、上スクロールで戻る。
// ここでやるのは hide を付け外しする合図だけで、動き自体はCSSに任せている。
// 昔はスクロールした量ぶんJSで動かしていたが、カードを描くのはブラウザ本体なので
// JSが1コマ遅れ、それがガタつきとして見えていた。合図だけなら遅れようがない。
// 隠れ始めるまでの粘りは、この2つの数字だけで決まる（時間ではなく動いた距離で見る）。
// 小さいほど早く消え、大きいほど粘る
var HDR_MOVE = 8;       // これだけ動いてから、隠すか出すかを判断する
var HDR_FROM_TOP = 12;  // 画面の一番上からこれより下にいる時だけ隠す。
                        // 0にしないのは、iOSの跳ね返りで上端が少し揺れる間に
                        // 隠れたり出たりを繰り返さないため
(function() {
  var header = document.querySelector('.sticky-header');
  if (!header) return;
  // 隠す時にどれだけ逃がすか。深海の模様の送り返しにも同じ値を使う。
  // スクロール中には触らず、高さが変わった時だけ入れ直す
  var syncHeight = function() { header.style.setProperty('--hdr-h', header.offsetHeight + 'px'); };
  syncHeight();
  if (window.ResizeObserver) new ResizeObserver(syncHeight).observe(header);

  var lastY = window.scrollY;
  var hidden = false;
  var setHidden = function(v) {
    if (hidden === v) return;
    hidden = v;
    header.classList.toggle('hide', v);
  };
  // PCの幅では見出しは隠れない。窓を広げた時に隠れたまま取り残されないよう戻す
  var wide = window.matchMedia('(min-width:900px)');
  var unhideOnWide = function() { if (wide.matches) setHidden(false); };
  if (wide.addEventListener) wide.addEventListener('change', unhideOnWide);
  else if (wide.addListener) wide.addListener(unhideOnWide);
  window.addEventListener('scroll', function() {
    if (_isDesktop() || document.body.classList.contains('mobile-detail-open')) return;
    var y = window.scrollY;
    if (y <= 0) { lastY = y; setHidden(false); return; }   // 一番上まで戻ったら必ず出す
    var d = y - lastY;
    // 指のわずかな揺れで出たり隠れたりしないよう、ある程度動いてから判断する。
    // 足りない間は lastY を進めないので、少しずつの動きもいずれ積み上がって効く
    if (Math.abs(d) < HDR_MOVE) return;
    lastY = y;
    setHidden(d > 0 && y > HDR_FROM_TOP);
  }, { passive: true });
})();

// ==== 明るい/暗い(海の中)/暗い(ふつう) の切り替え ====
// 初期値は head の中でOSの設定から決めてある。ここから先は見出しのタップで上書きできる。
function _applyTheme(theme, remember) {
  document.documentElement.setAttribute('data-theme', theme);
  // iOSの時計や電池が並ぶ帯の色。ここを合わせないとそこだけ浮く
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'deepsea' ? '#007FFF' : (theme === 'dark' ? '#000' : '#f0ede8'));
  if (remember) { try { localStorage.setItem('theme', theme); } catch(e) {} }
  // 色の大半はCSS変数なので勝手に切り替わるが、カテゴリの札だけJSで色を作っているため描き直す
  render();
  // 詳細画面は render() では作り直さない（打ちかけの本文を壊さないため）。
  // そのままだと札だけ前のテーマの色が残るので、ここで塗り直す
  var chip = document.querySelector('.detail-pane .cat-btn');
  if (chip) {
    var dn = notes.find(function(x){ return x.id === _mountedDetailId; });
    chip.setAttribute('style', catChipStyle(dn ? dn.cat : null));
  }
}
// 見出しをタップするたびに light → deepsea(深海) → dark(ふつうの暗さ) → light と巡回する
function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'light' ? 'deepsea' : (cur === 'deepsea' ? 'dark' : 'light');
  // 画面全体の色が変わるので、それ自体が合図になる。トーストは出さない
  _applyTheme(next, true);
}
// スマホの詳細画面には「collection」の見出しが無いので、代わりにカテゴリの札と
// 右のアイコンが並ぶ行を切り替え役にする。札もアイコンも元から役目を持っているので、
// その間の空きを押した時だけ反応させる。
// （iOSの時計そのものはOSが持っていて、タップはアプリまで届かない）
function _detailThemeTap(e) {
  if (_isDesktop()) return;
  if (e.target.closest('button, a, input')) return;
  toggleTheme();
}
// このファイルの本体は module なので、中の関数はそのままではHTMLの onclick から
// 呼べない。ここで外に出しておく（他の関数と同じ）
window._detailThemeTap = _detailThemeTap;
(function() {
  var title = document.getElementById('app-title');
  title.addEventListener('click', toggleTheme);
  title.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
  });
  // 自分で選ぶまでは、OSの設定に付いていく
  if (!window.matchMedia) return;
  var q = window.matchMedia('(prefers-color-scheme: dark)');
  var follow = function() {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch(e) {}
    if (saved === 'light' || saved === 'deepsea' || saved === 'dark') return;   // 手動で決めた後は追従しない
    _applyTheme(q.matches ? 'deepsea' : 'light', false);
  };
  if (q.addEventListener) q.addEventListener('change', follow);
  else if (q.addListener) q.addListener(follow);
})();
// スイッチが false の間だけ「C」ボタンを隠す（HTMLからは消していないので戻せる）
if (!DATE_RESET_ENABLED) document.getElementById('filter-reset').style.display = 'none';
window.onDateFilterChange = onDateFilterChange;
window.clearSearch = clearSearch;

function toggleTrash() { trashOpen = !trashOpen; catPanelOpen = false; if (!trashOpen) _setModalOpen(false); render(); }
window.toggleTrash = toggleTrash;

function renderTrash() {
  var el = document.getElementById('trash-panel');
  if (!trashOpen) { el.classList.remove('open'); _setModalOpen(false); return; }
  var items = trash;
  var rows = items.length
    ? items.slice().reverse().map(function(n) {
        var plain = htmlToPlainText(n.body || '').slice(0, 60);
        return '<div class="trash-item">'
          + '<div style="flex:1"><div class="trash-item-body">' + esc(plain) + (htmlToPlainText(n.body||'').length > 60 ? '…' : '') + '</div>'
          + '<div class="trash-item-meta">' + esc(n.cat || NO_CAT) + ' · ' + esc(n.date) + '</div></div>'
          + '<div style="display:flex;gap:4px">'
          + '<button class="btn-icon" onclick="window._restoreNote(\'' + n.id + '\')" title="元に戻す">' + IC.restore + '</button>'
          + '<button class="btn-icon" onclick="window._hardDelete(\'' + n.id + '\')" title="完全削除">' + IC.trash + '</button>'
          + '</div></div>';
      }).join('')
    : '<div style="text-align:center;padding:1rem;color:var(--text3);font-size:13px">ゴミ箱は空</div>';
  var emptyAll = items.length
    ? '<div style="display:flex;justify-content:flex-end;margin-top:0.75rem"><button class="btn btn-sm btn-danger" onclick="window._emptyTrash()">' + IC.trash + ' すべて完全削除</button></div>'
    : '';
  el.innerHTML = '<div class="modal"><div class="modal-header"><span class="modal-title">ゴミ箱 <span style="font-size:13px;color:var(--text3);font-weight:400">' + items.length + '件</span></span>'
    + '<button class="btn-icon" onclick="window.toggleTrash()">' + IC.x + '</button></div>'
    + rows + emptyAll + '</div>';
  el.classList.add('open');
  _setModalOpen(true);
}

window._restoreNote = async function(id) {
  var n = trash.find(function(x){ return x.id === id; });
  if (!n) return;
  trash = trash.filter(function(x){ return x.id !== id; });
  saveTrash(trash);
  try {
    await setDoc(doc(db, NOTES_COLL, id), { deleted: false, updatedAt: serverTimestamp() }, { merge: true });
  } catch(e) { console.error(e); }
  render();
};
window._hardDelete = async function(id) {
  trash = trash.filter(function(x){ return x.id !== id; });
  saveTrash(trash);
  try {
    await deleteDoc(doc(db, NOTES_COLL, id));
  } catch(e) { console.error(e); }
  renderTrash();
};
window._emptyTrash = async function() {
  var ids = trash.map(function(n){ return n.id; });
  trash = [];
  saveTrash(trash);
  for (var i = 0; i < ids.length; i++) {
    try { await deleteDoc(doc(db, NOTES_COLL, ids[i])); } catch(e) {}
  }
  renderTrash();
};

async function toggleCatPanel() {
  catPanelOpen = !catPanelOpen;
  trashOpen = false;
  if (catPanelOpen) {
    await renderCatPanel();
  } else {
    render();
  }
}
window.toggleCatPanel = toggleCatPanel;

async function renderCatPanel() {
  var el = document.getElementById('cat-panel');
  if (!catPanelOpen) { el.classList.remove('open'); _setModalOpen(false); return; }
  var counts = {};
  await Promise.all(categories.map(async function(c) {
    var snap = await getDocs(query(collection(db, NOTES_COLL), where('cat', '==', c), where('deleted', '==', false)));
    counts[c] = snap.size;
  }));
  var rows = categories.map(function(c, idx) {
    var count = counts[c] || 0;
    return '<div class="cat-row" data-idx="' + idx + '">'
      + '<span class="cat-name" onclick="window._catPanelGoto(' + idx + ')" style="font-size:14px;flex:1;min-width:0;cursor:pointer">' + esc(c)
      + ' <span style="font-size:12px;color:var(--text3)">' + count + '件</span></span>'
      + '<button class="btn-icon" onclick="window._editCatStart(' + idx + ')" title="名前を編集">' + IC.edit + '</button>'
      + '<button class="btn-icon" onclick="window._deleteCat(' + idx + ')"'
      + (count > 0 ? ' disabled style="opacity:0.3;cursor:not-allowed"' : '')
      + '>' + IC.trash + '</button></div>';
  }).join('');
  el.innerHTML = '<div class="modal" style="display:flex;flex-direction:column;padding:0;height:80vh;min-height:80vh;overflow:hidden;flex-shrink:0">'
    + '<div style="padding:1.25rem 1.25rem 0">'
    + '<div class="modal-header"><span class="modal-title">カテゴリー管理</span>'
    + '<button class="btn-icon" onclick="window.toggleCatPanel()">' + IC.x + '</button></div>'
    + '<div class="cat-add-row" style="margin-bottom:0.5rem"><input type="text" id="new-cat-input" placeholder="新しいカテゴリー名…">'
    + '<button class="btn btn-sm" onclick="window._addCat()">' + IC.plus + ' 追加</button></div>'
    + '<input type="text" id="cat-panel-search" placeholder="検索…" oninput="window._catPanelFilter(this.value)" style="width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none;margin-bottom:0.75rem">'
    + '</div>'
    + '<div style="overflow-y:auto;padding:0 1.25rem 1.25rem">' + rows + '</div>'
    + '</div>';
  el.classList.add('open');
  _setModalOpen(true);
}

window._catPanelFilter = function(val) {
  var q = val.toLowerCase();
  document.querySelectorAll('#cat-panel .cat-row').forEach(function(el) {
    el.style.display = el.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
};
window._deleteCat = async function(idx) {
  var name = categories[idx];
  if (name == null) return;
  categories = categories.filter(function(c){ return c !== name; });
  if (currentCat === name) currentCat = ALL_TAB;
  await deleteCategoryFromFirestore(name);
  render();
};
window._catPanelGoto = function(idx) {
  var name = categories[idx];
  if (name == null) return;
  catPanelOpen = false;
  switchCat(name);
};
window._editCatStart = function(idx) {
  var oldName = categories[idx];
  if (oldName == null) return;
  var row = document.querySelector('#cat-panel .cat-row[data-idx="' + idx + '"]');
  if (!row) return;
  row.innerHTML = '<input type="text" class="cat-edit-input" value="' + esc(oldName) + '" style="flex:1;min-width:0;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);padding:6px 10px;font-size:14px;color:var(--text);font-family:inherit;outline:none">'
    + '<button class="btn-icon" onclick="window._renameCat(' + idx + ')" title="保存">' + IC.check + '</button>'
    + '<button class="btn-icon" onclick="window.renderCatPanel()" title="キャンセル">' + IC.x + '</button>';
  var inp = row.querySelector('.cat-edit-input');
  inp.focus();
  inp.select();
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); window._renameCat(idx); }
    else if (e.key === 'Escape') { e.preventDefault(); window.renderCatPanel(); }
  });
};
window._renameCat = async function(idx) {
  var oldName = categories[idx];
  var row = document.querySelector('#cat-panel .cat-row[data-idx="' + idx + '"]');
  var inp = row ? row.querySelector('.cat-edit-input') : null;
  if (oldName == null || !inp) return;
  var newName = inp.value.trim();
  if (!newName || newName === oldName) { renderCatPanel(); return; }
  if (categories.indexOf(newName) >= 0) { inp.focus(); inp.select(); setSyncStatus('同名のカテゴリーが既にある'); return; }
  setSyncStatus('カテゴリー名を変更中…');
  try {
    await renameCategoryInFirestore(oldName, newName);
    categories[idx] = newName;
    if (_catFilterTimes[oldName] != null) {
      _catFilterTimes[newName] = _catFilterTimes[oldName];
      delete _catFilterTimes[oldName];
      try { localStorage.setItem('catFilterTimes', JSON.stringify(_catFilterTimes)); } catch(e) {}
    }
    if (currentCat === oldName) currentCat = newName;
    setSyncStatus('');
  } catch(e) { setSyncStatus('変更エラー'); console.error(e); }
  await renderCatPanel();
};
window.renderCatPanel = renderCatPanel;
window._addCat = async function() {
  var el = document.getElementById('new-cat-input');
  if (!el) return;
  var name = el.value.trim();
  if (!name || categories.indexOf(name) >= 0) return;
  categories.push(name);
  await saveCategoryToFirestore(name);
  currentCat = name;
  render();
};
function addCatInline() {
  var div = document.createElement('div');
  div.innerHTML = '<div class="modal-header">'
    + '<span class="modal-title">カテゴリーを追加</span>'
    + '<button class="btn-icon" id="cat-inline-close">' + IC.x + '</button>'
    + '</div>'
    + '<div class="cat-modal-add" style="margin-top:0;padding-top:0;border-top:none">'
    + '<input type="text" id="cat-inline-input" placeholder="カテゴリー名...">'
    + '<button class="btn btn-sm" id="cat-inline-submit">' + IC.plus + '</button>'
    + '</div>';
  document.getElementById('modal').innerHTML = '';
  document.getElementById('modal').appendChild(div);
  document.getElementById('overlay').classList.add('open');
  var input = document.getElementById('cat-inline-input');
  var submit = function() {
    var name = input.value.trim();
    if (!name || categories.indexOf(name) >= 0) { closeOverlay(); return; }
    categories.push(name);
    currentCat = name;
    closeOverlay();
    render();
  };
  document.getElementById('cat-inline-close').addEventListener('click', closeOverlay);
  document.getElementById('cat-inline-submit').addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
  setTimeout(function(){ input.focus(); }, 50);
}
window.addCatInline = addCatInline;
window.addNote = addNote;

document.getElementById('tabs').addEventListener('wheel', function(e) {
  e.preventDefault();
  this.scrollLeft += e.deltaY || e.deltaX;
}, {passive: false});

window.handleOverlayClick = handleOverlayClick;
setSyncStatus('接続中…');
