<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tiptapデモ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tiptap/2.4.0/tiptap.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #f5f5f5; padding: 20px; }
.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  max-width: 600px;
  margin: 0 auto;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.editor {
  min-height: 120px;
  font-size: 15px;
  line-height: 1.7;
  outline: none;
  color: #1a1a1a;
}
.editor p { margin: 0; }
.editor img {
  max-width: 100%;
  border-radius: 8px;
  display: block;
  margin: 8px 0;
  cursor: pointer;
}
.editor p.is-editor-empty:first-child::before {
  content: attr(data-placeholder);
  color: #aaa;
  pointer-events: none;
  float: left;
  height: 0;
}
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid #eee;
}
.toolbar button {
  background: none;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
  color: #555;
}
.status {
  margin-top: 12px;
  font-size: 12px;
  color: #aaa;
}
</style>
</head>
<body>
<div class="card">
  <div class="toolbar">
    <button id="img-btn">📷 画像を挿入</button>
    <input type="file" id="img-input" accept="image/*" style="display:none">
  </div>
  <div id="editor" class="editor"></div>
  <div class="status" id="status"></div>
</div>

<script type="module">
// Tiptapをimportで読み込む（CDN ESM版）
import { Editor } from 'https://esm.sh/@tiptap/core@2.4.0';
import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.4.0';
import Image from 'https://esm.sh/@tiptap/extension-image@2.4.0';
import Placeholder from 'https://esm.sh/@tiptap/extension-placeholder@2.4.0';

const editor = new Editor({
  element: document.getElementById('editor'),
  extensions: [
    StarterKit,
    Image.configure({ inline: false }),
    Placeholder.configure({ placeholder: 'メモを入力…' }),
  ],
  content: '<p></p>',
  onUpdate({ editor }) {
    var text = editor.getText();
    var bytes = new TextEncoder().encode(text).length;
    document.getElementById('status').textContent = bytes + ' B';
  },
});

// 画像挿入ボタン
document.getElementById('img-btn').onclick = function() {
  document.getElementById('img-input').click();
};
document.getElementById('img-input').onchange = function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    editor.chain().focus().setImage({ src: ev.target.result }).run();
  };
  reader.readAsDataURL(file);
};

// ペーストで画像挿入
document.addEventListener('paste', function(e) {
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') >= 0) {
      var file = items[i].getAsFile();
      var reader = new FileReader();
      reader.onload = function(ev) {
        editor.chain().focus().setImage({ src: ev.target.result }).run();
      };
      reader.readAsDataURL(file);
      return;
    }
  }
});
</script>
</body>
</html>
